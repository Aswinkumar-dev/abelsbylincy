<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Bag | Abel's By Lincy Sydney</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script>
    (function() {
      try {
        var userStr = localStorage.getItem('abl_current_user');
        if (!userStr || userStr === 'null' || userStr === 'undefined') {
          window.location.replace('account.html');
        }
      } catch(e) {}
    })();
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="styles.css?v=20260812-4">
</head>
<body data-page="cart">

  <div id="header-root"></div>

  <div id="cart-view-container"></div>

  <div id="footer-root"></div>

  <script src="app.js?v=20260812-4"></script>
  <script>
    let appliedCoupon = null;

    document.addEventListener('DOMContentLoaded', () => {
      renderCart();
    });

    function renderCart() {
      const container = document.getElementById('cart-view-container');
      const cart = window.abl.state.cart;

      if (cart.length === 0) {
        container.innerHTML = `
          <div class="container" style="padding: 100px 20px; text-align: center;">
            <div style="width: 80px; height: 80px; border-radius: 50%; background: var(--cream); display: flex; align-items: center; justify-content: center; margin: 0 auto 24px auto; color: var(--gold);">
              <i data-lucide="shopping-bag" style="width: 36px; height: 36px;"></i>
            </div>
            <h2 style="font-family: var(--font-serif); font-size: 32px; font-weight: 500; margin-bottom: 12px;">Your Shopping Bag is Empty</h2>
            <p style="color: var(--slate); font-size: 15px; max-width: 440px; margin: 0 auto 32px auto;">
              Discover our gold-plated earrings, bangles, rings, necklaces, bracelets and charm collections.
            </p>
            <a href="shop.html" class="btn-primary">
              Explore Jewellery Catalogue <i data-lucide="arrow-right" style="width: 14px; height: 14px;"></i>
            </a>
          </div>
        `;
        if (window.lucide) lucide.createIcons();
        return;
      }

      // Calculations
      const subtotal = cart.reduce((sum, i) => sum + i.price * i.quantity, 0);
      let discount = 0;
      if (appliedCoupon) {
        if (appliedCoupon.discountType === 'percentage') {
          discount = (subtotal * appliedCoupon.value) / 100;
        } else if (appliedCoupon.discountType === 'fixed') {
          discount = Math.min(subtotal, appliedCoupon.value);
        }
      }

      const discountedSubtotal = Math.max(0, subtotal - discount);
      let shipping = 0;
      const total = discountedSubtotal;

      container.innerHTML = `
        <div class="page-hero">
          <div class="container">
            <p class="section-subtitle">Your Selection</p>
            <h1>Shopping Bag (${cart.reduce((s, i) => s + i.quantity, 0)})</h1>
          </div>
        </div>

        <div class="container">
          <div class="cart-layout">
            
            <!-- Items List -->
            <div>
              ${cart.map(item => `
                <div class="cart-item-card">
                  <div class="cart-item-img" onclick="window.location.href='product.html?id=${item.id}'" style="cursor: pointer;">
                    <img src="${item.image}" alt="${item.name}">
                  </div>
                  
                  <div class="cart-item-details">
                    <div style="display: flex; justify-content: space-between; gap: 12px;">
                      <div>
                        <h4 style="font-family: var(--font-serif); font-size: 17px; font-weight: 500; color: var(--onyx); margin-bottom: 4px;">${item.name}</h4>
                        <p style="font-size: 12px; color: var(--slate);">${item.material} · Size: ${item.selectedSize}</p>
                      </div>
                      <button onclick="window.abl.removeFromCart('${item.id}')" style="color: var(--slate-light);" title="Remove Item">
                        <i data-lucide="trash-2" style="width: 18px; height: 18px;"></i>
                      </button>
                    </div>

                    <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 16px;">
                      <div class="qty-stepper" style="height: 36px;">
                        <button class="qty-btn" style="width: 32px;" onclick="window.abl.updateCartQty('${item.id}', ${item.quantity - 1})"><i data-lucide="minus" style="width: 12px;"></i></button>
                        <span class="qty-val" style="width: 32px; font-size: 13px;">${item.quantity}</span>
                        <button class="qty-btn" style="width: 32px;" onclick="window.abl.updateCartQty('${item.id}', ${item.quantity + 1})"><i data-lucide="plus" style="width: 12px;"></i></button>
                      </div>

                      <span style="font-size: 17px; font-weight: 700; color: var(--onyx);">${window.abl.formatMoney(item.price * item.quantity)}</span>
                    </div>
                  </div>
                </div>
              `).join('')}

              <div style="display: flex; justify-content: space-between; margin-top: 24px;">
                <a href="shop.html" class="btn-secondary" style="padding: 10px 20px;">
                  ← Continue Shopping
                </a>
              </div>
            </div>

            <!-- Order Summary Box -->
            <div>
              <div class="order-summary-box">
                <h3 style="font-family: var(--font-serif); font-size: 22px; font-weight: 600; margin-bottom: 20px;">Order Summary</h3>

                <!-- Free Shipping Progress -->
                <div class="free-shipping-progress">
                  <div style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 600;">
                    <span>${freeShippingRemaining === 0 ? '✓ Free Express Shipping Unlocked!' : `Add ${window.abl.formatMoney(freeShippingRemaining)} for Free Shipping`}</span>
                    <span>${progressPercent}%</span>
                  </div>
                  <div class="progress-track">
                    <div class="progress-fill" style="width: ${progressPercent}%;"></div>
                  </div>
                </div>

                <!-- Coupon Row -->
                <div class="coupon-row">
                  <input type="text" id="coupon-input" placeholder="Promo code (e.g. WELCOME10)" class="form-control" style="text-transform: uppercase;">
                  <button class="btn-primary" style="padding: 0 20px; font-size: 12px;" onclick="applyPromo()">Apply</button>
                </div>

                ${appliedCoupon ? `
                  <div style="background: var(--sage-light); color: var(--sage-dark); padding: 8px 12px; border-radius: var(--radius-sm); font-size: 12px; font-weight: 600; display: flex; justify-content: space-between; margin-bottom: 16px;">
                    <span>Coupon: ${appliedCoupon.code} (${appliedCoupon.label})</span>
                    <button onclick="removePromo()" style="color: var(--danger);">✕</button>
                  </div>
                ` : ''}

                <!-- Price Breakdown -->
                <div class="summary-row">
                  <span>Subtotal</span>
                  <span>${window.abl.formatMoney(subtotal)}</span>
                </div>

                ${discount > 0 ? `
                  <div class="summary-row" style="color: var(--success); font-weight: 600;">
                    <span>Discount</span>
                    <span>-${window.abl.formatMoney(discount)}</span>
                  </div>
                ` : ''}

                <div class="summary-row">
                  <span>Express Shipping</span>
                  <span style="color: var(--success); font-weight: 600;">FREE (Included)</span>
                </div>

                <div class="summary-row summary-total">
                  <span>Total (${window.abl.state.settings.primaryCurrency})</span>
                  <span>${window.abl.formatMoney(total)}</span>
                </div>
                <p style="font-size: 11px; color: var(--slate); font-style: italic; margin-top: 8px; text-align: center;">
                  * All product prices are inclusive of GST & Express Shipping. No extra fees.
                </p>

                <a href="checkout.html" class="btn-primary" style="width: 100%; margin-top: 24px; padding: 18px; text-align: center;">
                  Proceed to Secure Checkout <i data-lucide="lock" style="width: 16px; height: 16px;"></i>
                </a>

                <div style="text-align: center; margin-top: 16px; font-size: 11px; color: var(--slate);">
                  <i data-lucide="shield-check" style="width: 13px; height: 13px; display: inline-block; vertical-align: middle; color: var(--gold);"></i> Guaranteed Safe & Encrypted Stripe Checkout
                </div>
              </div>
            </div>

          </div>
        </div>
      `;

      if (window.lucide) lucide.createIcons();
    }

    function applyPromo() {
      const input = document.getElementById('coupon-input');
      if (!input || !input.value) return;
      const code = input.value.trim().toUpperCase();
      const cp = window.abl.state.coupons.find(c => c.code === code && c.active);
      if (!cp) {
        window.abl.showToast('Invalid or expired coupon code', 'alert-circle');
        return;
      }
      appliedCoupon = cp;
      window.abl.showToast(`Coupon "${cp.code}" applied! ${cp.label}`);
      renderCart();
    }

    function removePromo() {
      appliedCoupon = null;
      window.abl.showToast('Coupon removed');
      renderCart();
    }
  </script>
</body>
</html>
