<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Store Administration | Abel's By Lincy Sydney</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="styles.css?v=20260812-4">
</head>
<body style="background: var(--cream);">

  <!-- Admin Root -->
  <div id="admin-app-root"></div>

  <!-- Admin Modal Root -->
  <div id="admin-modal-root"></div>

  <script src="app.js?v=20260812-4"></script>
  <script>
    let activeAdminTab = 'overview';
    let sidebarCollapsed = false;

    // Real-Time Analytics Date Filtration State
    let analyticsPreset = 'all';
    let analyticsDateFrom = '2026-01-01';
    let analyticsDateTo = '2026-12-31';

    function parseOrderDate(dateStr) {
      if (!dateStr) return new Date();
      if (dateStr.toLowerCase().includes('today')) return new Date();
      const d = new Date(dateStr);
      if (!isNaN(d.getTime())) return d;
      const parts = dateStr.replace(/,/g, '').trim().split(/\s+/);
      if (parts.length >= 3) {
        const day = parseInt(parts[0], 10) || 1;
        const months = { jan:0, feb:1, mar:2, apr:3, may:4, jun:5, jul:6, aug:7, sep:8, oct:9, nov:10, dec:11 };
        const month = months[parts[1].toLowerCase().slice(0, 3)] !== undefined ? months[parts[1].toLowerCase().slice(0, 3)] : 7;
        const year = parseInt(parts[2], 10) || 2026;
        return new Date(year, month, day);
      }
      return new Date();
    }

    function setAnalyticsPreset(preset) {
      analyticsPreset = preset;
      const today = new Date();
      const todayStr = today.toISOString().slice(0, 10);
      
      if (preset === 'today') {
        analyticsDateFrom = todayStr;
        analyticsDateTo = todayStr;
      } else if (preset === '7days') {
        const d = new Date(today);
        d.setDate(d.getDate() - 7);
        analyticsDateFrom = d.toISOString().slice(0, 10);
        analyticsDateTo = todayStr;
      } else if (preset === 'month') {
        analyticsDateFrom = '2026-08-01';
        analyticsDateTo = '2026-08-31';
      } else if (preset === 'ytd') {
        analyticsDateFrom = '2026-01-01';
        analyticsDateTo = todayStr;
      } else {
        analyticsDateFrom = '2026-01-01';
        analyticsDateTo = '2026-12-31';
      }
      renderAdminApp();
    }

    function updateAnalyticsDate(field, val) {
      if (field === 'from') analyticsDateFrom = val;
      if (field === 'to') analyticsDateTo = val;
      analyticsPreset = 'custom';
      renderAdminApp();
    }

    function exportFilteredCSV() {
      const fromD = new Date(analyticsDateFrom + 'T00:00:00');
      const toD = new Date(analyticsDateTo + 'T23:59:59');

      const filteredOrders = window.abl.state.orders.filter(o => {
        const oDate = parseOrderDate(o.date);
        return oDate >= fromD && oDate <= toD;
      });

      const now = new Date().toISOString().slice(0, 10);
      let csvContent = '========================================\n';
      csvContent += `ABEL\'S BY LINCY - FILTERED SALES REPORT\n`;
      csvContent += `Period: ${analyticsDateFrom} to ${analyticsDateTo} (Generated: ${now})\n`;
      csvContent += `Total Orders in Range: ${filteredOrders.length}\n`;
      csvContent += '========================================\n\n';

      csvContent += 'Order ID,Customer,Email,Piece,Date,Status,Total Amount\n';
      filteredOrders.forEach(o => {
        csvContent += `"${o.id}","${o.customer}","${o.email}","${o.product || 'Fine Jewellery'}","${o.date}","${o.status}","${o.total}"\n`;
      });

      csvContent += '\n--- INVENTORY ASSET VALUATION (LIVE) ---\n';
      csvContent += 'SKU,Product Name,Category,Unit Price,Stock Units,Asset Valuation,Vault Location\n';
      window.abl.state.products.forEach(p => {
        csvContent += `"${p.sku}","${p.name}","${p.category}","$${p.price}",${p.stockQty},"$${p.price * (p.stockQty || 0)}","${p.storageLocation || 'Vault A-01'}"\n`;
      });

      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `abels_filtered_sales_report_${analyticsDateFrom}_to_${analyticsDateTo}.csv`;
      a.click();
      URL.revokeObjectURL(url);
      window.abl.showToast(`📊 Filtered CSV Report Downloaded (${filteredOrders.length} records)`, 'download');
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderAdminApp();
    });

    function renderAdminApp() {
      const root = document.getElementById('admin-app-root');
      const isAuth = window.abl.state.adminLoggedIn;

      // 1. If NOT authenticated, show Admin Login Form
      if (!isAuth) {
        root.innerHTML = `
          <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; background: var(--onyx-deep);">
            <div style="background: var(--cloud-white); border-radius: var(--radius-xl); max-width: 440px; width: 100%; padding: 40px; box-shadow: var(--shadow-xl); text-align: center;">
              
              <div style="margin-bottom: 24px;">
                <span style="font-family: var(--font-serif); font-size: 26px; font-weight: 700; letter-spacing: 0.1em; color: var(--onyx);">ABEL’S</span><br>
                <span style="font-size: 10px; letter-spacing: 0.35em; color: var(--gold); font-weight: 600;">PORTAL LOGIN</span>
              </div>

              <p style="font-size: 13px; color: var(--slate); margin-bottom: 28px;">
                Authorized personnel only. Please sign in with your administrator ID and secure password.
              </p>

              <form onsubmit="event.preventDefault(); handleAdminSubmit(this);">
                <div class="form-group" style="text-align: left;">
                  <label class="form-label">Admin ID / Email</label>
                  <input type="text" id="admin-id-input" class="form-control" placeholder="Enter admin ID or email" autocomplete="username" required>
                </div>

                <div class="form-group" style="text-align: left;">
                  <label class="form-label">Password</label>
                  <input type="password" id="admin-pass-input" class="form-control" placeholder="Enter password" autocomplete="current-password" required>
                </div>

                <button type="submit" class="btn-primary" style="width: 100%; margin-top: 8px; padding: 14px;">
                  Unlock Admin Portal <i data-lucide="lock" style="width: 14px; height: 14px;"></i>
                </button>
              </form>

              <div style="margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--border); font-size: 12px; color: var(--slate);">
                <a href="index.html" style="color: var(--gold); text-decoration: underline;">← Return to Storefront</a>
              </div>

            </div>
          </div>
        `;
        if (window.lucide) lucide.createIcons();
        return;
      }

      // 2. Admin is authenticated — render full admin panel
      const currentAdmin = window.abl.state.adminUser || window.abl.state.roles[0];
      const isSuperAdmin = true;

      const screens = [
        { id: 'overview', label: 'Overview', icon: 'layout-dashboard' },
        { id: 'products', label: 'Products', icon: 'package' },
        { id: 'categories', label: 'Categories', icon: 'tag' },
        { id: 'inventory', label: 'Inventory', icon: 'layers' },
        { id: 'orders', label: 'Orders', icon: 'shopping-cart' },
        { id: 'customers', label: 'Customers', icon: 'users' },
        { id: 'coupons', label: 'Coupons', icon: 'ticket' },
        { id: 'cms', label: 'Website CMS', icon: 'globe' },
        { id: 'messages', label: 'Messages', icon: 'inbox' },
        { id: 'settings', label: 'Settings', icon: 'settings' },
        { id: 'analytics', label: 'Analytics', icon: 'chart-no-axes-column' }
      ];

      const visibleScreens = screens;

      root.innerHTML = `
        <div class="admin-layout">
          
          <!-- Sidebar -->
          <aside class="admin-sidebar ${sidebarCollapsed ? 'collapsed' : ''}">
            <div class="admin-sidebar-header">
              ${!sidebarCollapsed ? `
                <div>
                  <span style="font-family: var(--font-serif); font-size: 18px; font-weight: 700; letter-spacing: 0.1em;">ABEL’S</span><br>
                  <span style="font-size: 9px; letter-spacing: 0.35em; color: var(--gold); font-weight: 600;">ADMIN SUITE</span>
                </div>
              ` : ''}
              <button onclick="toggleAdminNav()" style="color: rgba(255,255,255,0.6); margin-left: auto;">
                <i data-lucide="${sidebarCollapsed ? 'chevron-right' : 'chevron-left'}"></i>
              </button>
            </div>

            <!-- Role Badge in Sidebar -->
            ${!sidebarCollapsed ? `
              <div style="padding: 12px 16px; margin: 8px 12px; background: rgba(212, 175, 55, 0.08); border: 1px solid rgba(212, 175, 55, 0.2); border-radius: var(--radius-md);">
                <div style="display: flex; align-items: center; gap: 8px;">
                  <i data-lucide="${isSuperAdmin ? 'crown' : 'user-check'}" style="width: 16px; height: 16px; color: var(--gold);"></i>
                  <div>
                    <p style="font-size: 12px; font-weight: 700; color: var(--gold); margin: 0;">${currentAdmin.role}</p>
                    <p style="font-size: 10px; color: rgba(255,255,255,0.6); margin: 0;">${isSuperAdmin ? 'Full Access' : `${visibleScreens.length} Screens Permitted`}</p>
                  </div>
                </div>
              </div>
            ` : ''}

            <nav class="admin-nav">
              ${visibleScreens.map(s => `
                <button class="admin-nav-item ${activeAdminTab === s.id ? 'active' : ''}" onclick="setAdminTab('${s.id}')" title="${s.label}">
                  <i data-lucide="${s.icon}" style="width: 18px; height: 18px; flex-shrink: 0;"></i>
                  ${!sidebarCollapsed ? s.label : ''}
                </button>
              `).join('')}
            </nav>

            <div style="padding: 16px; border-top: 1px solid rgba(255,255,255,0.08); display: flex; flex-direction: column; gap: 8px;">
              <a href="index.html" target="_blank" class="btn-secondary" style="color: var(--cloud-white); border-color: rgba(255,255,255,0.2); padding: 8px; font-size: 11px; text-align: center;">
                <i data-lucide="external-link" style="width: 12px; height: 12px;"></i> ${!sidebarCollapsed ? 'View Storefront' : ''}
              </a>
              <button onclick="window.abl.adminLogout()" class="admin-nav-item" style="color: var(--danger); justify-content: center; padding: 8px;">
                <i data-lucide="log-out" style="width: 16px;"></i> ${!sidebarCollapsed ? 'Sign Out' : ''}
              </button>
            </div>
          </aside>

          <!-- Main Body -->
          <div class="admin-main">
            
            <!-- Topbar -->
            <header class="admin-topbar">
              <div style="display: flex; align-items: center; gap: 12px; width: 340px;">
                <i data-lucide="search" style="color: var(--slate); width: 16px;"></i>
                <input type="text" placeholder="Search orders, catalog, clients..." style="border: none; outline: none; width: 100%; font-size: 13px; background: transparent;">
              </div>

              <div style="display: flex; align-items: center; gap: 16px;">
                <div style="display: flex; align-items: center; gap: 10px; padding-left: 12px; border-left: 1px solid var(--border);">
                  <div style="width: 36px; height: 36px; border-radius: 50%; background: ${isSuperAdmin ? 'var(--gold)' : 'var(--slate-dark)'}; color: ${isSuperAdmin ? 'var(--onyx)' : '#fff'}; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px;">
                    ${(currentAdmin.user || 'A').charAt(0).toUpperCase()}
                  </div>
                  <div>
                    <p style="font-size: 13px; font-weight: 600; line-height: 1; margin: 0;">${currentAdmin.user}</p>
                    <div style="display: flex; align-items: center; gap: 6px; margin-top: 2px;">
                      <span style="font-size: 10px; color: ${isSuperAdmin ? 'var(--gold)' : 'var(--slate)'}; font-weight: 600;">${currentAdmin.role}</span>
                      <span style="font-size: 9px; background: var(--cream); padding: 1px 5px; border-radius: 4px; color: var(--slate);">${currentAdmin.loginId || 'user'}</span>
                    </div>
                  </div>
                </div>
                <button onclick="window.abl.adminLogout()" class="btn-secondary" style="padding: 6px 12px; font-size: 11px; display: flex; align-items: center; gap: 6px;">
                  <i data-lucide="log-out" style="width: 13px; height: 13px;"></i> Sign Out
                </button>
              </div>
            </header>

            <main class="admin-body">
              ${renderTabContent()}
            </main>

          </div>

        </div>
      `;

      if (window.lucide) lucide.createIcons();
    }

    function handleAdminSubmit(form) {
      const id = document.getElementById('admin-id-input').value;
      const pass = document.getElementById('admin-pass-input').value;
      const success = window.abl.adminLogin(id, pass);
      if (success) {
        renderAdminApp();
      }
    }

    function toggleAdminNav() {
      sidebarCollapsed = !sidebarCollapsed;
      renderAdminApp();
    }

    function setAdminTab(t) {
      activeAdminTab = t;
      renderAdminApp();
    }

    // =========================================================================
    // 12-SCREEN TAB RENDERERS WITH FULL CRUD
    // =========================================================================

    function renderTabContent() {
      const pCount = window.abl.state.products.length;
      const oCount = window.abl.state.orders.length;
      const totalRev = window.abl.state.orders.reduce((sum, o) => {
        const num = parseFloat(o.total.replace(/[^0-9.-]+/g, '')) || 0;
        return sum + num;
      }, 0);

      switch (activeAdminTab) {
        
        // 1. OVERVIEW (Real-time dynamic calculations)
        case 'overview': {
          const liveOrderSum = window.abl.state.orders.reduce((sum, o) => {
            const val = o.rawAmount || parseFloat((o.total || '$0').replace(/[^0-9.-]+/g, '')) || 0;
            return sum + val;
          }, 0);
          const grossRevCalculated = liveOrderSum + 24850;
          const totalStockUnits = window.abl.state.products.reduce((s, p) => s + (p.stockQty || 0), 0);
          const totalInventoryValue = window.abl.state.products.reduce((s, p) => s + (p.price * (p.stockQty || 0)), 0);
          const lowStockCount = window.abl.state.products.filter(p => p.stockQty <= 8).length;

          return `
            <div style="margin-bottom: 24px;">
              <h2 style="font-family: var(--font-serif); font-size: 26px; font-weight: 600;">Executive Dashboard</h2>
              <p style="font-size: 13px; color: var(--slate);">Real-time live performance metrics calculated from active orders & inventory.</p>
            </div>

            <div class="kpi-grid">
              <div class="kpi-card">
                <div class="kpi-title">Gross Sales Revenue <i data-lucide="dollar-sign" style="color: var(--gold);"></i></div>
                <div class="kpi-val">${window.abl.formatMoney(grossRevCalculated)}</div>
                <div class="kpi-trend trend-up"><i data-lucide="trending-up" style="width: 14px;"></i> Live synced (${window.abl.state.orders.length} orders)</div>
              </div>
              <div class="kpi-card">
                <div class="kpi-title">Active Catalogue <i data-lucide="package" style="color: var(--gold);"></i></div>
                <div class="kpi-val">${window.abl.state.products.length} Pieces</div>
                <div class="kpi-trend trend-up">${totalStockUnits} total units in stock</div>
              </div>
              <div class="kpi-card">
                <div class="kpi-title">Orders Placed <i data-lucide="shopping-cart" style="color: var(--gold);"></i></div>
                <div class="kpi-val">${window.abl.state.orders.length}</div>
                <div class="kpi-trend trend-up">Latest: ${window.abl.state.orders[0] ? window.abl.state.orders[0].id : 'N/A'}</div>
              </div>
              <div class="kpi-card">
                <div class="kpi-title">Inventory Asset Value <i data-lucide="shield-check" style="color: var(--gold);"></i></div>
                <div class="kpi-val">${window.abl.formatMoney(totalInventoryValue)}</div>
                <div class="kpi-trend ${lowStockCount > 0 ? 'trend-down' : 'trend-up'}">
                  ${lowStockCount > 0 ? `${lowStockCount} low stock alerts` : 'Stock optimal'}
                </div>
              </div>
            </div>

            <!-- Revenue Trend Chart -->
            <div class="admin-table-card" style="padding: 24px;">
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                <div>
                  <h4 style="font-family: var(--font-serif); font-size: 18px; font-weight: 600;">2026 Sales Revenue Trend (AUD)</h4>
                  <p style="font-size: 12px; color: var(--slate);">Real-time monthly revenue trajectory across 12-month timeline.</p>
                </div>
                <span style="font-size: 12px; background: var(--sage-light); color: var(--sage-dark); padding: 4px 10px; border-radius: 12px; font-weight: 600;">In Thousands AUD</span>
              </div>
              <div class="revenue-bar-chart">
                ${[
                  { m: 'Jan', v: 42 }, { m: 'Feb', v: 65 }, { m: 'Mar', v: 55 }, { m: 'Apr', v: 80 },
                  { m: 'May', v: 72 }, { m: 'Jun', v: 90 }, { m: 'Jul', v: 85 }, { m: 'Aug', v: Math.round(110 + (liveOrderSum / 100)) },
                  { m: 'Sep', v: 95 }, { m: 'Oct', v: 120 }, { m: 'Nov', v: 108 }, { m: 'Dec', v: 135 }
                ].map(bar => `
                  <div class="bar-col">
                    <div class="bar-pill" style="height: ${(bar.v / 140) * 100}%;" title="$${bar.v}k AUD"></div>
                    <span class="bar-label">${bar.m}</span>
                  </div>
                `).join('')}
              </div>
            </div>

            <!-- Split Tables -->
            <div style="display: grid; grid-template-columns: 1.5fr 1fr; gap: 24px;">
              <div class="admin-table-card">
                <div class="table-header">
                  <h4 style="font-family: var(--font-serif); font-size: 17px; font-weight: 600;">Recent Live Orders</h4>
                  <button onclick="setAdminTab('orders')" style="font-size: 12px; color: var(--gold); font-weight: 600;">View All (${window.abl.state.orders.length})</button>
                </div>
                <table class="admin-table">
                  <thead>
                    <tr><th>Order ID</th><th>Customer</th><th>Status</th><th>Total</th></tr>
                  </thead>
                  <tbody>
                    ${window.abl.state.orders.slice(0, 5).map(o => `
                      <tr>
                        <td style="font-weight: 600;">${o.id}</td>
                        <td>${o.customer}</td>
                        <td><span class="status-badge status-${o.status.toLowerCase()}">${o.status}</span></td>
                        <td style="font-weight: 600;">${o.total}</td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>

              <div class="admin-table-card">
                <div class="table-header">
                  <h4 style="font-family: var(--font-serif); font-size: 17px; font-weight: 600; color: var(--danger);">Low Stock Alerts</h4>
                  <button onclick="setAdminTab('inventory')" style="font-size: 12px; color: var(--gold); font-weight: 600;">Inventory</button>
                </div>
                <div style="padding: 12px 24px;">
                  ${window.abl.state.products.filter(p => p.stockQty <= 8).map(p => `
                    <div style="display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border-light);">
                      <div style="display: flex; align-items: center; gap: 10px;">
                        <img src="${p.image}" style="width: 32px; height: 32px; border-radius: 6px; object-fit: cover;">
                        <div>
                          <p style="font-size: 12px; font-weight: 600; margin: 0;">${p.name}</p>
                          <span style="font-size: 10px; color: var(--slate);">${p.sku}</span>
                        </div>
                      </div>
                      <div style="display: flex; align-items: center; gap: 8px;">
                        <span style="font-size: 11px; font-weight: 700; color: var(--danger); background: var(--danger-bg); padding: 2px 8px; border-radius: 8px;">${p.stockQty} left</span>
                        <button class="btn-secondary" style="padding: 2px 8px; font-size: 10px;" onclick="adjustStockQty('${p.id}', 5)">+5</button>
                      </div>
                    </div>
                  `).join('')}
                </div>
              </div>
            </div>
          `;
        }

        // 2. PRODUCTS (Add, Edit, Delete)
        case 'products':
          return `
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
              <div>
                <h2 style="font-family: var(--font-serif); font-size: 26px; font-weight: 600;">Products Management</h2>
                <p style="font-size: 13px; color: var(--slate);">Add, edit, or remove fine gold-plated jewellery pieces.</p>
              </div>
              <button class="btn-primary" onclick="openProductModal()">
                <i data-lucide="plus"></i> Add New Product
              </button>
            </div>

            <div class="admin-table-card">
              <table class="admin-table">
                <thead>
                  <tr>
                    <th>Product</th>
                    <th>Category</th>
                    <th>Price</th>
                    <th>Stock</th>
                    <th>Gemstone</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody>
                  ${window.abl.state.products.map(p => `
                    <tr>
                      <td>
                        <div style="display: flex; align-items: center; gap: 12px;">
                          <img src="${p.image}" style="width: 44px; height: 44px; border-radius: 8px; object-fit: cover;">
                          <div>
                            <p style="font-weight: 600; font-size: 13px; color: var(--onyx);">${p.name}</p>
                            <p style="font-size: 11px; color: var(--slate);">${p.sku} · ${p.material}</p>
                          </div>
                        </div>
                      </td>
                      <td style="text-transform: capitalize;">${p.category}</td>
                      <td style="font-weight: 600;">${window.abl.formatMoney(p.price)}</td>
                      <td>
                        <span style="font-size: 12px; font-weight: 600; color: ${p.stockQty > 5 ? 'var(--success)' : 'var(--danger)'};">
                          ${p.stockQty} units
                        </span>
                      </td>
                      <td>${p.gemstone}</td>
                      <td>
                        <div style="display: flex; gap: 8px;">
                          <button class="action-btn" title="Edit Piece" onclick="openProductModal('${p.id}')"><i data-lucide="pencil"></i></button>
                          <button class="action-btn" title="Delete Piece" style="color: var(--danger);" onclick="deleteProduct('${p.id}')"><i data-lucide="trash-2"></i></button>
                        </div>
                      </td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          `;

        // 3. CATEGORIES (Add, Edit, Delete)
        case 'categories':
          return `
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
              <h2 style="font-family: var(--font-serif); font-size: 26px; font-weight: 600;">Categories Management</h2>
              <button class="btn-primary" onclick="openCategoryModal()">+ Add Category</button>
            </div>
            <div class="products-grid">
              ${window.abl.state.categories.map(cat => `
                <div class="collection-card" style="aspect-ratio: 4/3;">
                  <img src="${cat.image}" alt="${cat.name}">
                  <div class="collection-overlay">
                    <h3 class="collection-name">${cat.name}</h3>
                    <p class="collection-count">${window.abl.state.products.filter(p => p.category === cat.id).length} Active Products</p>
                    <div style="display: flex; gap: 8px; margin-top: 10px;">

    function compressImage(file, maxWidth = 800, maxHeight = 800, quality = 0.85) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = function(e) {
          const img = new Image();
          img.onload = function() {
            let width = img.width;
            let height = img.height;
            if (width > maxWidth || height > maxHeight) {
              if (width > height) {
                height = Math.round((height * maxWidth) / width);
                width = maxWidth;
              } else {
                width = Math.round((width * maxHeight) / height);
                height = maxHeight;
              }
            }
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.onerror = () => resolve(e.target.result);
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function dataURLtoBlob(dataurl) {
      const arr = dataurl.split(',');
      const mimetype = arr[0].match(/:(.*?);/)[1];
      const bstr = atob(arr[1]);
      let n = bstr.length;
      const u8arr = new Uint8Array(n);
      while(n--){
          u8arr[n] = bstr.charCodeAt(n);
      }
      return new Blob([u8arr], {type:mimetype});
    }

    function getCategoryIdFromSlug(slug) {
      const mapping = {
        'rings': 1,
        'necklaces': 2,

      };
      return mapping[slug] || 1;
    }

    function slugify(text) {
      return text.toString().toLowerCase()
        .replace(/\s+/g, '-')
        .replace(/[^\w\-]+/g, '')
        .replace(/\-\-+/g, '-')
        .replace(/^-+/, '')
        .replace(/-+$/, '');
    }

    async function saveProductForm(form, id) {
      const colorsVal = form.colors.value;
      const colorsList = colorsVal.split(',').map(c => c.trim()).filter(Boolean);

      // Validation check
      if (colorsList.length === 0) {
        if (!currentDefaultImages[0]) {
          alert('Error: The first image slot for the global product is mandatory.');
          return;
        }
      } else {
        for (const col of colorsList) {
          if (!currentColorImages[col] || !currentColorImages[col][0]) {
            alert(`Error: The first image slot for color "${col}" is mandatory.`);
            return;
          }
        }
      }

      // Consolidate images for local storefront
      const allImages = [...currentDefaultImages.filter(Boolean)];
      Object.keys(currentColorImages).forEach(col => {
        allImages.push(...currentColorImages[col].filter(Boolean));
      });
      const primaryImage = allImages[0] || 'https://images.unsplash.com/photo-1605100804763-247f67b3557e?auto=format&fit=crop&w=800&q=80';

      const basePrice = parseFloat(form.price.value);
      const salePrice = form.salePrice.value ? parseFloat(form.salePrice.value) : null;
      const category = form.category.value;

      // Construct specs object for saving
      const specificationsObj = {};
      currentSpecs.forEach(s => {
        if (s.key.trim()) specificationsObj[s.key.trim()] = s.value.trim();
      });

      // 1. Sync Locally in LocalStorage to satisfy immediate UI operations
      if (id) {
        const item = window.abl.state.products.find(p => p.id === id);
        if (item) {
          item.name = form.name.value;
          item.description = form.description.value;
          item.category = category;
          item.price = basePrice;
          item.salePrice = salePrice;
          item.originalPrice = salePrice ? basePrice : Math.round(basePrice * 1.2);
          item.colors = colorsVal;
          item.specifications = specificationsObj;
          item.image = primaryImage;
          item.images = allImages;
          item.defaultImages = currentDefaultImages;
          item.colorImages = currentColorImages;
          window.abl.showToast(`✨ ${item.name} updated successfully!`);
        }
      } else {
        const newP = {
          id: `p${Date.now()}`,
          name: form.name.value,
          description: form.description.value,
          category: category,
          price: salePrice || basePrice,
          originalPrice: salePrice ? basePrice : Math.round(basePrice * 1.2),
          colors: colorsVal,
          specifications: specificationsObj,
          image: primaryImage,
          images: allImages,
          defaultImages: currentDefaultImages,
          colorImages: currentColorImages,
          rating: 5.0,
          reviews: 1,
          badge: 'new',
          inStock: true,
          sku: `ABL-${category.charAt(0).toUpperCase()}${Math.floor(100 + Math.random() * 900)}`
        };
        window.abl.state.products.unshift(newP);
        window.abl.showToast(`🎉 ${newP.name} created successfully!`);
      }

      localStorage.setItem('abl_products', JSON.stringify(window.abl.state.products));

      // 2. Sync to Cloudy & DB Backend (Fetch Request)
      try {
        const formData = new FormData();
        formData.append('categoryId', getCategoryIdFromSlug(category));
        formData.append('name', form.name.value);
        formData.append('slug', slugify(form.name.value));
        formData.append('description', form.description.value);
        formData.append('price', basePrice);
        formData.append('salePrice', salePrice || '');
        formData.append('colors', colorsVal);
        formData.append('specifications', JSON.stringify(specificationsObj));

        // Add stocks
        if (colorsList.length > 0) {
          colorsList.forEach(col => {
            const cleanCol = col.replace(/\s+/g, '_');
            const stockVal = form[`stock_color_${cleanCol}`] ? form[`stock_color_${cleanCol}`].value : 0;
            formData.append(`stock_color_${cleanCol}`, stockVal);
          });
        } else {
          formData.append('stockQty', form.stockQty.value);
        }

        // Add default images
        currentDefaultImages.forEach((img, idx) => {
          if (img && img.startsWith('data:')) {
            const blob = dataURLtoBlob(img);
            formData.append(`images_default_${idx}`, blob, `default_${idx}.jpg`);
          }
        });

        // Add color images
        Object.keys(currentColorImages).forEach(col => {
          const cleanColName = col.replace(/\s+/g, '_');
          currentColorImages[col].forEach((img, idx) => {
            if (img && img.startsWith('data:')) {
              const blob = dataURLtoBlob(img);
              formData.append(`images_color_${cleanColName}_${idx}`, blob, `color_${cleanColName}_${idx}.jpg`);
            }
          });
        });

        const token = localStorage.getItem('abl_admin_token') || '';
        const url = id ? `http://localhost:5000/api/admin/products/${id}` : 'http://localhost:5000/api/admin/products';
        const method = id ? 'PUT' : 'POST';

        // Perform the API call asynchronously in background
        fetch(url, {
          method: method,
          headers: {
            'Authorization': 'Bearer ' + token
          },
          body: formData
        }).then(res => res.json())
          .then(data => {
            if (data.success) {
              window.abl.showToast('✅ Database & Cloudinary synchronization complete!');
            } else {
              console.log('Database synchronization response:', data.message);
            }
          }).catch(err => {
            console.log('Database synchronization offline/inactive:', err.message);
          });

      } catch (err) {
        console.warn('Database integration request preparation failed:', err.message);
      }

      document.getElementById('admin-modal-root').innerHTML = '';
      renderAdminApp();
    }

                  <option value="gold" ${slide.theme === 'gold' ? 'selected' : ''}>Gold Theme (Dark Onyx / Gold text)</option>
                  <option value="sapphire" ${slide.theme === 'sapphire' ? 'selected' : ''}>Burgundy Theme (Deep Burgundy / Warm Ivory / Champagne)</option>
                  <option value="emerald" ${slide.theme === 'emerald' ? 'selected' : ''}>Emerald Theme (Teal / Emerald Green text)</option>
                </select>
              </div>

              <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 15px;">
                <div class="form-group" style="margin: 0;">
                  <label class="form-label">CTA Button Text</label>
                  <input type="text" class="form-control" name="ctaText" value="${slide.ctaText || 'Shop Collection'}" required>
                </div>
                <div class="form-group" style="margin: 0;">
                  <label class="form-label">CTA Button Link</label>
                  <select class="form-control" name="ctaLink">
                    <option value="shop.html" ${slide.ctaLink === 'shop.html' ? 'selected' : ''}>Shop All</option>
                    <option value="shop.html?category=earrings" ${slide.ctaLink === 'shop.html?category=earrings' ? 'selected' : ''}>Earrings Category</option>
                    <option value="shop.html?category=bracelets" ${slide.ctaLink === 'shop.html?category=bracelets' ? 'selected' : ''}>Bracelets Category</option>
                    <option value="shop.html?category=bangles" ${slide.ctaLink === 'shop.html?category=bangles' ? 'selected' : ''}>Bangles Category</option>
                    <option value="shop.html?category=necklaces" ${slide.ctaLink === 'shop.html?category=necklaces' ? 'selected' : ''}>Necklaces Category</option>
                    <option value="shop.html?category=rings" ${slide.ctaLink === 'shop.html?category=rings' ? 'selected' : ''}>Rings Category</option>
                    <option value="shop.html?category=charms" ${slide.ctaLink === 'shop.html?category=charms' ? 'selected' : ''}>Charms Category</option>
                  </select>
                </div>
              </div>

              <div class="form-group">
                <label class="form-label">Hero Photo Source</label>
                <div style="display: flex; gap: 12px; margin-bottom: 8px;">
                  <button type="button" class="btn-secondary" style="padding: 6px 12px; font-size: 11px;" onclick="document.getElementById('slide-file-input').click()">
                    Upload File (Compressed)
                  </button>
                  <input type="file" id="slide-file-input" accept="image/*" style="display: none;" onchange="handleSlideImageUpload(event)">
                  <span style="font-size: 11px; color: var(--slate); align-self: center;">OR paste custom URL below</span>
                </div>
                <input type="text" class="form-control" name="imageUrl" id="slide-image-url-input" value="${currentSlideModalImage.startsWith('data:') ? '' : currentSlideModalImage}" placeholder="https://images.unsplash.com/..." oninput="currentSlideModalImage=this.value; renderSlideModalPreview();">
              </div>

              <div id="slide-upload-preview" style="margin-bottom: 20px;">
                ${currentSlideModalImage ? `<img src="${currentSlideModalImage}" style="width: 100%; height: 120px; object-fit: cover; border-radius: 8px;">` : ''}
              </div>

              <button type="submit" class="btn-primary" style="width: 100%;">${isEdit ? 'Save Slide Updates' : 'Add Slide to Showcase'}</button>
            </form>
          </div>
        </div>
      `;
      if (window.lucide) lucide.createIcons();
    };

    window.saveHeroSlide = function(event, idx) {
      event.preventDefault();
      const form = event.target;
      
      const tagline = form.tagline.value;
      const title = form.title.value;
      const description = form.description.value;
      const ctaText = form.ctaText.value;
      const ctaLink = form.ctaLink.value;
      const theme = form.theme.value;
      const image = currentSlideModalImage || 'assets/earrings.webp';

      if (!window.abl.state.cms.heroSlides) {
        window.abl.state.cms.heroSlides = [];
      }

      const newSlide = {
        id: idx !== null ? window.abl.state.cms.heroSlides[idx].id : 'slide-' + Date.now(),
        tagline,
        title,
        description,
        ctaText,
        ctaLink,
        image,
        theme
      };

      if (idx !== null) {
        window.abl.state.cms.heroSlides[idx] = newSlide;
        window.abl.showToast('Hero slide updated successfully');
      } else {
        window.abl.state.cms.heroSlides.push(newSlide);
        window.abl.showToast('New hero slide added');
      }

      localStorage.setItem('abl_cms', JSON.stringify(window.abl.state.cms));
      document.getElementById('admin-modal-root').innerHTML = '';
      renderAdminApp();
    };

    window.deleteHeroSlide = function(idx) {
      if (confirm('Are you sure you want to delete this hero slide?')) {
        window.abl.state.cms.heroSlides.splice(idx, 1);
        localStorage.setItem('abl_cms', JSON.stringify(window.abl.state.cms));
        window.abl.showToast('Hero slide deleted');
        renderAdminApp();
      }
    };

    window.moveHeroSlide = function(idx, direction) {
      const slides = window.abl.state.cms.heroSlides;
      const targetIdx = idx + direction;
      if (targetIdx < 0 || targetIdx >= slides.length) return;

      // Swap
      const temp = slides[idx];
      slides[idx] = slides[targetIdx];
      slides[targetIdx] = temp;

      localStorage.setItem('abl_cms', JSON.stringify(window.abl.state.cms));
      window.abl.showToast('Slides reordered');
      renderAdminApp();
    };

    window.saveGlobalCMS = function(form) {
      window.abl.state.cms.announcement = form.announcement.value;
      localStorage.setItem('abl_cms', JSON.stringify(window.abl.state.cms));
      window.abl.showToast('Announcement updated live');
      renderAdminApp();
    };

    function exportCSV() {
      const now = new Date().toISOString().slice(0, 10);
      let csvContent = '========================================\n';
      csvContent += `ABEL\'S BY LINCY - REAL-TIME EXECUTIVE REPORT (${now})\n`;
      csvContent += '========================================\n\n';

      csvContent += '--- RECENT ORDERS & TRANSACTIONS ---\n';
      csvContent += 'Order ID,Customer,Email,Piece,Date,Status,Total\n';
      window.abl.state.orders.forEach(o => {
        csvContent += `"${o.id}","${o.customer}","${o.email}","${o.product}","${o.date}","${o.status}","${o.total}"\n`;
      });

      csvContent += '\n--- INVENTORY ASSET VALUATION ---\n';
      csvContent += 'SKU,Product Name,Category,Unit Price,Stock Units,Asset Valuation,Vault Location\n';
      window.abl.state.products.forEach(p => {
        csvContent += `"${p.sku}","${p.name}","${p.category}","$${p.price}",${p.stockQty},"$${p.price * (p.stockQty || 0)}","${p.storageLocation || 'Vault A-01'}"\n`;
      });

      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `abels_realtime_report_${now}.csv`;
      a.click();
      URL.revokeObjectURL(url);
      window.abl.showToast('Real-time Executive CSV Report Exported', 'download');
    }
  </script>
</body>
</html>
