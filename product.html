<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details | Abel's By Lincy Sydney</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="styles.css?v=20260812-4">
</head>
<body data-page="product">

  <div id="header-root"></div>

  <div class="container" id="pdp-container">
    <!-- PDP dynamically rendered below -->
  </div>

  <!-- Zoom Modal Root -->
  <div id="zoom-modal-root"></div>

  <div id="footer-root"></div>

  <script src="app.js?v=20260812-4"></script>
  <script>
    let currentProduct = null;
    let selectedImageIndex = 0;
    let selectedSize = '7';
    let currentQty = 1;
    let openTab = 'description';

    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const pid = params.get('id') || 'p1';
      currentProduct = window.abl.state.products.find(p => p.id === pid) || window.abl.state.products[0];
      if (currentProduct.sizes && currentProduct.sizes.length > 0) {
        selectedSize = currentProduct.sizes[0];
      }
      renderPDP();
    });

    function renderPDP() {
      const p = currentProduct;
      const isWishlisted = window.abl.state.wishlist.includes(p.id);
      const activeImg = p.images[selectedImageIndex] || p.image;
      const related = window.abl.state.products.filter(item => item.category === p.category && item.id !== p.id).slice(0, 4);

      document.title = `${p.name} | Abel's By Lincy`;

      const discountPercent = p.originalPrice ? Math.round(((p.originalPrice - p.price) / p.originalPrice) * 100) : 15;
      const originalPriceVal = p.originalPrice || Math.round(p.price * 1.18);

      const container = document.getElementById('pdp-container');
      container.innerHTML = `
        <!-- Breadcrumbs -->
        <div style="padding: 20px 0 12px 0; font-size: 12px; color: var(--slate); display: flex; align-items: center; gap: 8px;">
          <a href="index.html">Home</a>
          <i data-lucide="chevron-right" style="width: 12px; height: 12px;"></i>
          <a href="shop.html">Shop</a>
          <i data-lucide="chevron-right" style="width: 12px; height: 12px;"></i>
          <a href="shop.html?category=${p.category}" style="text-transform: capitalize; color: var(--gold);">${p.category}</a>
          <i data-lucide="chevron-right" style="width: 12px; height: 12px;"></i>
          <span style="color: var(--onyx); font-weight: 500;">${p.name}</span>
        </div>

        <div class="pdp-grid">
          
          <!-- Image Gallery (Compact Thumbnails + Bounded Main Image) -->
          <div class="pdp-gallery-wrapper">
            <div class="pdp-thumbnails">
              ${p.images.map((img, idx) => `
                <button class="thumbnail-btn ${idx === selectedImageIndex ? 'active' : ''}" onclick="selectThumb(${idx})">
                  <img src="${img}" alt="${p.name} - Angle ${idx + 1}" onerror="this.src='https://images.unsplash.com/photo-1605100804763-247f67b3557e?auto=format&fit=crop&w=800&q=80'">
                </button>
              `).join('')}
            </div>

            <div class="pdp-main-image" onclick="openZoom('${activeImg}')">
              <img src="${activeImg}" alt="${p.name}" onerror="this.src='https://images.unsplash.com/photo-1605100804763-247f67b3557e?auto=format&fit=crop&w=800&q=80'">
              <div style="position: absolute; bottom: 12px; right: 12px; background: rgba(255,255,255,0.9); backdrop-filter: blur(4px); padding: 5px 10px; border-radius: 20px; font-size: 11px; display: flex; align-items: center; gap: 6px; box-shadow: var(--shadow-sm);">
                <i data-lucide="zoom-in" style="width: 13px; height: 13px;"></i> Click to zoom
              </div>
            </div>
          </div>

          <!-- Product Info & Reference Style Buy Box -->
          <div class="pdp-info">
            <p class="pdp-header-category">${p.category} · SKU: ${p.sku}</p>
            <h1 class="pdp-title">${p.name}</h1>

            <div class="pdp-rating-row">
              <div class="stars">
                ${Array(5).fill(0).map((_, idx) => `
                  <i data-lucide="star" style="width: 14px; height: 14px; ${idx < Math.floor(p.rating) ? 'fill: var(--gold);' : 'color: var(--border);'}"></i>
                `).join('')}
              </div>
              <span style="font-size: 13px; color: var(--slate); font-weight: 500;">${p.rating} (${p.reviews} customer reviews)</span>
            </div>

            <!-- Price Block with Discount Badge -->
            <div class="pdp-price-row">
              <span class="pdp-price">${window.abl.formatMoney(p.price)}</span>
              <span class="pdp-original-price">${window.abl.formatMoney(originalPriceVal)}</span>
              <span class="pdp-discount-badge">↓ ${discountPercent}% OFF</span>
              <span class="pdp-stock-tag">In Stock (${p.stockQty} available)</span>
            </div>

            <p class="pdp-description">${p.description}</p>

            <!-- Material / Metal Choice -->
            <div class="pdp-option-group">
              <div class="pdp-option-label">
                <span>Metal & Material: <strong style="color: var(--gold-dark);">${p.material}</strong></span>
              </div>
            </div>

            <!-- Size Selector (Matching Reference Design) -->
            ${p.sizes && p.sizes.length > 0 ? `
              <div class="pdp-option-group">
                <div class="pdp-option-label">
                  <span>Select Size</span>
                  <a href="faq.html" style="font-size: 12px; color: var(--gold-dark); text-transform: none; text-decoration: underline; font-weight: 600;">Size Guide & Chart</a>
                </div>
                <div class="size-pill-group">
                  ${p.sizes.map(size => `
                    <button class="size-pill ${selectedSize === size ? 'active' : ''}" onclick="selectSize('${size}')">
                      ${size}
                    </button>
                  `).join('')}
                </div>
              </div>
            ` : ''}

            <!-- Reference Savings / Offer Box -->
            <div class="pdp-offer-box">
              <div class="pdp-offer-left">
                <span class="pdp-offer-badge">Special Offer</span>
                <span class="pdp-offer-text">Apply code <strong>WELCOME10</strong> for 10% instant checkout savings</span>
              </div>
            </div>

            <!-- Dual Action Buttons (Add to Bag + Buy Now) -->
            <div class="pdp-actions-container">
              <button class="pdp-btn-add" onclick="handleAddToCart()">
                <i data-lucide="shopping-bag" style="width: 16px;"></i> Add to Bag
              </button>

              <button class="pdp-btn-buy" onclick="handleBuyNow()">
                Buy Now · ${window.abl.formatMoney(p.price * currentQty)}
              </button>

              <button class="pdp-btn-wishlist ${isWishlisted ? 'active' : ''}" onclick="window.abl.toggleWishlist('${p.id}')" title="Save to Wishlist">
                <i data-lucide="heart" style="${isWishlisted ? 'fill: var(--danger);' : ''}"></i>
              </button>
            </div>

            <!-- Guarantee Perks Box -->
            <div style="background: var(--cream); border-radius: var(--radius-md); padding: 14px 18px; margin-bottom: 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 12px;">
              <div style="display: flex; align-items: center; gap: 8px;"><i data-lucide="truck" style="color: var(--gold); width: 15px;"></i> Free Express Shipping $150+</div>
              <div style="display: flex; align-items: center; gap: 8px;"><i data-lucide="award" style="color: var(--gold); width: 15px;"></i> Australian Hallmark</div>
              <div style="display: flex; align-items: center; gap: 8px;"><i data-lucide="refresh-cw" style="color: var(--gold); width: 15px;"></i> 30-Day Easy Sizing Returns</div>
              <div style="display: flex; align-items: center; gap: 8px;"><i data-lucide="gift" style="color: var(--gold); width: 15px;"></i> Complimentary Velvet Box</div>
            </div>

            <!-- Accordion Specs -->
            <div class="pdp-accordion">
              <div class="accordion-item">
                <button class="accordion-header" onclick="toggleTab('description')">
                  <span>Craftsmanship & Details</span>
                  <i data-lucide="${openTab === 'description' ? 'chevron-up' : 'chevron-down'}"></i>
                </button>
                ${openTab === 'description' ? `
                  <div class="accordion-body">
                    <ul style="padding-left: 20px; display: flex; flex-direction: column; gap: 6px;">
                      ${p.details.map(d => `<li>${d}</li>`).join('')}
                    </ul>
                  </div>
                ` : ''}
              </div>

              <div class="accordion-item">
                <button class="accordion-header" onclick="toggleTab('shipping')">
                  <span>Shipping & Australian Delivery</span>
                  <i data-lucide="${openTab === 'shipping' ? 'chevron-up' : 'chevron-down'}"></i>
                </button>
                ${openTab === 'shipping' ? `
                  <div class="accordion-body">
                    <p>All orders placed before 2pm AEST are dispatched same day from our Sydney atelier via Australia Post Express. Fully insured transit with tracking provided.</p>
                  </div>
                ` : ''}
              </div>

              <div class="accordion-item">
                <button class="accordion-header" onclick="toggleTab('care')">
                  <span>Jewellery Care & Storage</span>
                  <i data-lucide="${openTab === 'care' ? 'chevron-up' : 'chevron-down'}"></i>
                </button>
                ${openTab === 'care' ? `
                  <div class="accordion-body">
                    <p>Store your fine jewellery in the provided Abel's By Lincy anti-tarnish velvet pouch. Avoid contact with perfumes, chlorine, and harsh chemicals. Gently clean using a microfiber polishing cloth.</p>
                  </div>
                ` : ''}
              </div>
            </div>

          </div>
        </div>

        <!-- Related Pieces -->
        ${related.length > 0 ? `
          <div style="margin-top: 60px; padding-top: 40px; border-top: 1px solid var(--border);">
            <div class="section-header" style="margin-bottom: 32px;">
              <p class="section-subtitle">Complete The Set</p>
              <h2 class="section-title">You May Also Treasure</h2>
            </div>
            <div class="products-grid">
              ${related.map(r => `
                <div class="product-card" onclick="window.location.href='product.html?id=${r.id}'">
                  <div class="product-img-wrapper">
                    <img src="${r.image}" alt="${r.name}" onerror="this.src='https://images.unsplash.com/photo-1605100804763-247f67b3557e?auto=format&fit=crop&w=800&q=80'">
                  </div>
                  <div class="product-info">
                    <p class="product-category">${r.category}</p>
                    <h4 class="product-name">${r.name}</h4>
                    <span class="current-price">${window.abl.formatMoney(r.price)}</span>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        ` : ''}
      `;

      if (window.lucide) lucide.createIcons();
    }

    function selectThumb(idx) {
      selectedImageIndex = idx;
      renderPDP();
    }

    function selectSize(size) {
      selectedSize = size;
      renderPDP();
    }

    function toggleTab(tab) {
      openTab = openTab === tab ? null : tab;
      renderPDP();
    }

    function handleAddToCart() {
      window.abl.addToCart(currentProduct.id, currentQty, selectedSize);
    }

    function handleBuyNow() {
      window.abl.addToCart(currentProduct.id, currentQty, selectedSize);
      window.location.href = 'checkout.html';
    }

    function openZoom(imgUrl) {
      const root = document.getElementById('zoom-modal-root');
      root.innerHTML = `
        <div class="modal-backdrop" onclick="this.remove()">
          <div class="modal-content" style="max-width: 760px; padding: 12px; background: transparent; box-shadow: none;" onclick="event.stopPropagation()">
            <img src="${imgUrl}" style="width: 100%; border-radius: var(--radius-lg); box-shadow: var(--shadow-xl);">
            <button class="action-btn" style="position: absolute; top: 24px; right: 24px; background: var(--cloud-white);" onclick="document.getElementById('zoom-modal-root').innerHTML=''"><i data-lucide="x"></i></button>
          </div>
        </div>
      `;
      if (window.lucide) lucide.createIcons();
    }
  </script>
</body>
</html>
