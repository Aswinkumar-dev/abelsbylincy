<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details | Abel's By Lincy Sydney</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="styles.css?v=20260812-4">
</head>
<body data-page="product">

  <div id="header-root"></div>

  <div class="container" id="pdp-container">
    <!-- PDP dynamically rendered below -->
  </div>

  <!-- Zoom Modal Root -->
  <div id="zoom-modal-root"></div>

  <div id="footer-root"></div>

  <script src="app.js?v=20260812-4"></script>
  <script>
    let currentProduct = null;
    let selectedImageIndex = 0;
    let selectedSize = '7';
    let currentQty = 1;
    let openTab = 'description';

    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const pid = params.get('id') || 'p1';
      currentProduct = window.abl.state.products.find(p => p.id === pid) || window.abl.state.products[0];
      if (currentProduct.sizes && currentProduct.sizes.length > 0) {
        selectedSize = currentProduct.sizes[0];
      }
      renderPDP();
    });

    function renderPDP() {
      const p = currentProduct;
      const isWishlisted = window.abl.state.wishlist.includes(p.id);
      const activeImg = p.images[selectedImageIndex] || p.image;
      const related = window.abl.state.products.filter(item => item.category === p.category && item.id !== p.id).slice(0, 4);
      const reviewsList = getProductReviews(p.id);

      document.title = `${p.name} | Abel's By Lincy`;

      const discountPercent = p.originalPrice ? Math.round(((p.originalPrice - p.price) / p.originalPrice) * 100) : 15;
      const originalPriceVal = p.originalPrice || Math.round(p.price * 1.18);

      const container = document.getElementById('pdp-container');
      container.innerHTML = `
        <!-- Breadcrumbs -->
        <div style="padding: 20px 0 12px 0; font-size: 12px; color: var(--slate); display: flex; align-items: center; gap: 8px;">
          <a href="index.html">Home</a>
          <i data-lucide="chevron-right" style="width: 12px; height: 12px;"></i>
          <a href="shop.html">Shop</a>
          <i data-lucide="chevron-right" style="width: 12px; height: 12px;"></i>
          <a href="shop.html?category=${p.category}" style="text-transform: capitalize; color: var(--gold);">${p.category}</a>
          <i data-lucide="chevron-right" style="width: 12px; height: 12px;"></i>
          <span style="color: var(--onyx); font-weight: 500;">${p.name}</span>
        </div>

        <div class="pdp-grid">
          
          <!-- Image Gallery (Compact Thumbnails + Bounded Main Image) -->
          <div class="pdp-gallery-wrapper">
            <div class="pdp-thumbnails">
              ${p.images.map((img, idx) => `
                <button class="thumbnail-btn ${idx === selectedImageIndex ? 'active' : ''}" onclick="selectThumb(${idx})">
                  <img src="${img}" alt="${p.name} - Angle ${idx + 1}" onerror="this.src='https://images.unsplash.com/photo-1605100804763-247f67b3557e?auto=format&fit=crop&w=800&q=80'">
                </button>
              `).join('')}
            </div>

            <div class="pdp-main-image" onclick="openZoom('${activeImg}')">
              <img src="${activeImg}" alt="${p.name}" onerror="this.src='https://images.unsplash.com/photo-1605100804763-247f67b3557e?auto=format&fit=crop&w=800&q=80'" fetchpriority="high">
              <div style="position: absolute; bottom: 12px; right: 12px; background: rgba(255,255,255,0.9); backdrop-filter: blur(4px); padding: 5px 10px; border-radius: 20px; font-size: 11px; display: flex; align-items: center; gap: 6px; box-shadow: var(--shadow-sm);">
                <i data-lucide="zoom-in" style="width: 13px; height: 13px;"></i> Click to zoom
              </div>
            </div>
          </div>

          <!-- Product Info & Reference Style Buy Box -->
          <div class="pdp-info">
            <p class="pdp-header-category">${p.category} · SKU: ${p.sku}</p>
            <h1 class="pdp-title">${p.name}</h1>

            <div class="pdp-rating-row">
              <div class="stars">
                ${Array(5).fill(0).map((_, idx) => `
                  <i data-lucide="star" style="width: 14px; height: 14px; ${idx < Math.floor(p.rating) ? 'fill: var(--gold);' : 'color: var(--border);'}"></i>
                `).join('')}
              </div>
              <span style="font-size: 13px; color: var(--slate); font-weight: 500;">${p.rating} (${p.reviews} customer reviews)</span>
            </div>

            <!-- Price Block with Discount Badge -->
            <div class="pdp-price-row">
              <span class="pdp-price">${window.abl.formatMoney(p.price)}</span>
              <span class="pdp-original-price">${window.abl.formatMoney(originalPriceVal)}</span>
              <span class="pdp-discount-badge">↓ ${discountPercent}% OFF</span>
              <span class="pdp-stock-tag">In Stock (${p.stockQty} available)</span>
            </div>

            <p class="pdp-description">${p.description}</p>

            ${p.category === 'rings' ? `
              <div style="margin-bottom: 24px; margin-top: -12px;">
                <button type="button" onclick="openRingSizeModal()" style="background: none; border: none; cursor: pointer; text-decoration: underline; color: var(--gold-dark); font-weight: 600; display: inline-flex; align-items: center; gap: 6px; padding: 0; font-size: 13px;">
                  <i data-lucide="ruler" style="width: 15px; height: 15px;"></i> Measure your size
                </button>
              </div>
            ` : ''}

            <!-- Material / Metal Choice -->
            <div class="pdp-option-group">
              <div class="pdp-option-label">
                <span>Metal & Material: <strong style="color: var(--gold-dark);">${p.material}</strong></span>
              </div>
            </div>

            <!-- Size Selector (Matching Reference Design) -->
            ${p.sizes && p.sizes.length > 0 ? `
              <div class="pdp-option-group">
                <div class="pdp-option-label">
                  <span>Select Size</span>
                  <a href="faq.html" style="font-size: 12px; color: var(--gold-dark); text-transform: none; text-decoration: underline; font-weight: 600;">Size Guide & Chart</a>
                </div>
                <div class="size-pill-group">
                  ${p.sizes.map(size => `
                    <button class="size-pill ${selectedSize === size ? 'active' : ''}" onclick="selectSize('${size}')">
                      ${size}
                    </button>
                  `).join('')}
                </div>
              </div>
            ` : ''}

            <!-- Reference Savings / Offer Box -->
            <div class="pdp-offer-box">
              <div class="pdp-offer-left">
                <span class="pdp-offer-badge">Special Offer</span>
                <span class="pdp-offer-text">Apply code <strong>WELCOME10</strong> for 10% instant checkout savings</span>
              </div>
            </div>

            <!-- Dual Action Buttons (Add to Bag + Buy Now) -->
            <div class="pdp-actions-container">
              <button class="pdp-btn-add" onclick="handleAddToCart()">
                <i data-lucide="shopping-bag" style="width: 16px;"></i> Add to Bag
              </button>

              <button class="pdp-btn-buy" onclick="handleBuyNow()">
                Buy Now · ${window.abl.formatMoney(p.price * currentQty)}
              </button>

              <button class="pdp-btn-wishlist ${isWishlisted ? 'active' : ''}" onclick="window.abl.toggleWishlist('${p.id}')" title="Save to Wishlist">
                <i data-lucide="heart" style="${isWishlisted ? 'fill: var(--danger);' : ''}"></i>
              </button>
            </div>

            <!-- Guarantee Perks Box -->
            <div style="background: var(--cream); border-radius: var(--radius-md); padding: 14px 18px; margin-bottom: 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 12px;">
              <div style="display: flex; align-items: center; gap: 8px;"><i data-lucide="truck" style="color: var(--gold); width: 15px;"></i> Free Express Shipping $150+</div>
              <div style="display: flex; align-items: center; gap: 8px;"><i data-lucide="award" style="color: var(--gold); width: 15px;"></i> Australian Hallmark</div>
              <div style="display: flex; align-items: center; gap: 8px;"><i data-lucide="refresh-cw" style="color: var(--gold); width: 15px;"></i> 30-Day Easy Sizing Returns</div>
              <div style="display: flex; align-items: center; gap: 8px;"><i data-lucide="gift" style="color: var(--gold); width: 15px;"></i> Complimentary Velvet Box</div>
            </div>

            <!-- Accordion Specs -->
            <div class="pdp-accordion">
              <div class="accordion-item">
                <button class="accordion-header" onclick="toggleTab('description')">
                  <span>Craftsmanship & Details</span>
                  <i data-lucide="${openTab === 'description' ? 'chevron-up' : 'chevron-down'}"></i>
                </button>
                ${openTab === 'description' ? `
                  <div class="accordion-body">
                    <ul style="padding-left: 20px; display: flex; flex-direction: column; gap: 6px;">
                      ${p.details.map(d => `<li>${d}</li>`).join('')}
                    </ul>
                  </div>
                ` : ''}
              </div>

              <div class="accordion-item">
                <button class="accordion-header" onclick="toggleTab('shipping')">
                  <span>Shipping & Australian Delivery</span>
                  <i data-lucide="${openTab === 'shipping' ? 'chevron-up' : 'chevron-down'}"></i>
                </button>
                ${openTab === 'shipping' ? `
                  <div class="accordion-body">
                    <p>All orders placed before 2pm AEST are dispatched same day from our Sydney atelier via Australia Post Express. Fully insured transit with tracking provided.</p>
                  </div>
                ` : ''}
              </div>

              <div class="accordion-item">
                <button class="accordion-header" onclick="toggleTab('care')">
                  <span>Jewellery Care & Storage</span>
                  <i data-lucide="${openTab === 'care' ? 'chevron-up' : 'chevron-down'}"></i>
                </button>
                ${openTab === 'care' ? `
                  <div class="accordion-body">
                    <p>Store your fine jewellery in the provided Abel's By Lincy anti-tarnish velvet pouch. Avoid contact with perfumes, chlorine, and harsh chemicals. Gently clean using a microfiber polishing cloth.</p>
                  </div>
                ` : ''}
              </div>
            </div>

          </div>
        </div>

        <!-- Reviews Section -->
        <div style="margin-top: 60px; padding-top: 40px; border-top: 1px solid var(--border);">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 12px;">
            <div>
              <h3 style="font-family: var(--font-serif); font-size: 24px; font-weight: 600; color: var(--onyx); margin: 0;">Customer Reviews</h3>
              <div style="display: flex; align-items: center; gap: 8px; margin-top: 6px;">
                <div class="stars">
                  ${Array(5).fill(0).map((_, idx) => `
                    <i data-lucide="star" style="width: 16px; height: 16px; ${idx < Math.floor(p.rating) ? 'fill: var(--gold); color: var(--gold);' : 'color: var(--border);'}"></i>
                  `).join('')}
                </div>
                <span style="font-size: 14px; color: var(--slate); font-weight: 500;">${p.rating} out of 5 stars (based on ${reviewsList.length} reviews)</span>
              </div>
            </div>
            <button class="btn-primary" onclick="handleWriteReviewClick()" style="padding: 10px 24px;">Write a Review</button>
          </div>

          <!-- Review Form Box (Hidden by default) -->
          <div id="review-form-container" style="display: none; background: var(--cream); border-radius: var(--radius-md); padding: 24px; margin-bottom: 32px; border: 1px solid var(--border);">
            <h4 style="font-family: var(--font-serif); font-size: 18px; font-weight: 600; margin-bottom: 16px; color: var(--onyx);">Write a Review</h4>
            <form id="review-form" onsubmit="submitReview(event)">
              <div class="form-group">
                <label class="form-label">Rating</label>
                <div class="rating-input-stars" style="display: flex; gap: 8px; margin-bottom: 12px; cursor: pointer;">
                  ${[1, 2, 3, 4, 5].map(starNum => `
                    <i data-lucide="star" class="rating-star-btn" data-value="${starNum}" onclick="setRatingValue(${starNum})" style="width: 22px; height: 22px; fill: var(--gold); color: var(--gold);"></i>
                  `).join('')}
                </div>
                <input type="hidden" id="review-rating-value" value="5">
              </div>

              <div class="form-group">
                <label class="form-label">Review Title</label>
                <input type="text" id="review-title-input" class="form-control" placeholder="e.g. Absolutely gorgeous!" required style="background: var(--cloud-white);">
              </div>

              <div class="form-group">
                <label class="form-label">Review Details</label>
                <textarea id="review-text-input" class="form-control" rows="4" placeholder="share your feedback" style="background: var(--cloud-white);"></textarea>
              </div>

              <button type="submit" class="btn-primary" style="padding: 12px 30px;">Submit Review</button>
            </form>
          </div>

          <!-- Reviews List Grid -->
          <div style="display: flex; flex-direction: column; gap: 24px;">
            ${reviewsList.map(r => `
              <div style="padding-bottom: 24px; border-bottom: 1px solid var(--border); display: flex; gap: 16px; align-items: flex-start;">
                <img src="${r.avatar || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=120&h=120&fit=crop'}" alt="${r.user_name}" style="width: 44px; height: 44px; border-radius: 50%; object-fit: cover;" loading="lazy">
                <div style="flex: 1;">
                  <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;">
                    <h5 style="font-size: 14px; font-weight: 600; color: var(--onyx); margin: 0;">${r.user_name}</h5>
                    <span style="font-size: 12px; color: var(--slate);">${new Date(r.created_at).toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric' })}</span>
                  </div>
                  <div style="display: flex; align-items: center; gap: 8px; margin: 4px 0 8px 0;">
                    <div class="stars">
                      ${Array(5).fill(0).map((_, idx) => `
                        <i data-lucide="star" style="width: 12px; height: 12px; ${idx < r.rating ? 'fill: var(--gold); color: var(--gold);' : 'color: var(--border);'}"></i>
                      `).join('')}
                    </div>
                    ${r.is_verified_purchase ? `<span style="font-size: 10px; background: rgba(198,168,106,0.15); color: var(--gold-dark); padding: 1px 6px; border-radius: 4px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase;">Verified Purchase</span>` : ''}
                  </div>
                  <h6 style="font-size: 14px; font-weight: 600; color: var(--onyx); margin: 0 0 6px 0;">${r.title}</h6>
                  <p style="font-size: 13.5px; line-height: 1.6; color: var(--slate); margin: 0;">${r.review_text || ''}</p>
                </div>
              </div>
            `).join('')}
            ${reviewsList.length === 0 ? '<div style="font-style: italic; color: var(--slate);">Be the first to review this product!</div>' : ''}
          </div>
        </div>

        <!-- Related Pieces -->
        ${related.length > 0 ? `
          <div style="margin-top: 60px; padding-top: 40px; border-top: 1px solid var(--border);">
            <div class="section-header" style="margin-bottom: 32px;">
              <p class="section-subtitle">Complete The Set</p>
              <h2 class="section-title">You May Also Treasure</h2>
            </div>
            <div class="products-grid">
              ${related.map(r => `
                <div class="product-card" onclick="window.location.href='product.html?id=${r.id}'">
                  <div class="product-img-wrapper">
                    <img src="${r.image}" alt="${r.name}" onerror="this.src='https://images.unsplash.com/photo-1605100804763-247f67b3557e?auto=format&fit=crop&w=800&q=80'" loading="lazy">
                  </div>
                  <div class="product-info">
                    <p class="product-category">${r.category}</p>
                    <h4 class="product-name">${r.name}</h4>
                    <span class="current-price">${window.abl.formatMoney(r.price)}</span>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        ` : ''}
      `;

      if (window.lucide) lucide.createIcons();
    }

    function getProductReviews(productId) {
      const localKey = `abl_reviews_${productId}`;
      let reviews = JSON.parse(localStorage.getItem(localKey));
      
      if (!reviews) {
        reviews = [
          {
            id: `r_mock1_${productId}`,
            user_name: 'Amelia Smith',
            avatar: 'https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=120&h=120&fit=crop',
            rating: 5,
            title: 'Absolutely Stunning Piece!',
            review_text: 'Bought this for daily wear. It is exceptionally beautiful, has a gorgeous weight to it, and has not tarnished after weeks of showers. Highly recommend!',
            is_verified_purchase: true,
            created_at: new Date(Date.now() - 5 * 24 * 60 * 60 * 1000).toISOString()
          },
          {
            id: `r_mock2_${productId}`,
            user_name: 'Chloe Davis',
            avatar: 'https://images.unsplash.com/photo-1508214751196-bcfd4ca60f91?w=120&h=120&fit=crop',
            rating: 4,
            title: 'Beautiful packaging & shine',
            review_text: 'The packaging feels very premium. The shine is exquisite. Dropped one star only because delivery took one extra day to Brisbane.',
            is_verified_purchase: true,
            created_at: new Date(Date.now() - 12 * 24 * 60 * 60 * 1000).toISOString()
          }
        ];
        localStorage.setItem(localKey, JSON.stringify(reviews));
      }
      return reviews;
    }

    window.handleWriteReviewClick = function() {
      const user = window.abl.state.currentUser;
      if (!user) {
        alert('Please login or register to write a review. Redirecting to account page...');
        window.location.href = 'account.html';
        return;
      }
      
      const formContainer = document.getElementById('review-form-container');
      if (formContainer) {
        formContainer.style.display = formContainer.style.display === 'none' ? 'block' : 'none';
      }
    };

    window.setRatingValue = function(val) {
      document.getElementById('review-rating-value').value = val;
      const stars = document.querySelectorAll('.rating-input-stars .rating-star-btn');
      stars.forEach((s, idx) => {
        if (idx < val) {
          s.style.fill = 'var(--gold)';
          s.style.color = 'var(--gold)';
        } else {
          s.style.fill = 'none';
          s.style.color = 'var(--border)';
        }
      });
    };

    window.submitReview = async function(event) {
      event.preventDefault();
      const user = window.abl.state.currentUser;
      if (!user) {
        alert('Please log in to submit a review.');
        window.location.href = 'account.html';
        return;
      }

      const rating = parseInt(document.getElementById('review-rating-value').value) || 5;
      const title = document.getElementById('review-title-input').value.trim();
      const reviewText = document.getElementById('review-text-input').value.trim();

      const newReview = {
        id: `r_${Date.now()}`,
        productId: currentProduct.id,
        user_name: user.name,
        avatar: user.avatar || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=120&h=120&fit=crop',
        rating: rating,
        title: title || 'Review',
        review_text: reviewText,
        is_verified_purchase: true,
        created_at: new Date().toISOString()
      };

      const localReviewsKey = `abl_reviews_${currentProduct.id}`;
      const localReviews = JSON.parse(localStorage.getItem(localReviewsKey) || '[]');
      localReviews.unshift(newReview);
      localStorage.setItem(localReviewsKey, JSON.stringify(localReviews));

      const reviewsCount = localReviews.length + (currentProduct.reviews || 0);
      const totalRating = localReviews.reduce((sum, r) => sum + r.rating, 0) + (currentProduct.rating * (currentProduct.reviews || 1));
      currentProduct.rating = parseFloat((totalRating / (reviewsCount || 1)).toFixed(1));
      currentProduct.reviews = reviewsCount;
      localStorage.setItem('abl_products', JSON.stringify(window.abl.state.products));

      window.abl.showToast('🎉 Review submitted successfully!');

      document.getElementById('review-form-container').style.display = 'none';
      document.getElementById('review-form').reset();
      
      try {
        const token = localStorage.getItem('abl_user_token') || '';
        fetch('http://localhost:5000/api/reviews/create', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token
          },
          body: JSON.stringify({
            productId: currentProduct.id,
            rating: rating,
            title: title || 'Review',
            reviewText: reviewText
          })
        }).then(res => res.json())
          .then(data => {
            if (data.success) {
              console.log('Review synced to backend database.');
            }
          }).catch(err => {
            console.log('Backend review sync skipped (offline):', err.message);
          });
      } catch (err) {}

      renderPDP();
    };

    function selectThumb(idx) {
      selectedImageIndex = idx;
      renderPDP();
    }

    function selectSize(size) {
      selectedSize = size;
      renderPDP();
    }

    function toggleTab(tab) {
      openTab = openTab === tab ? null : tab;
      renderPDP();
    }

    function handleAddToCart() {
      window.abl.addToCart(currentProduct.id, currentQty, selectedSize);
    }

    function handleBuyNow() {
      window.abl.addToCart(currentProduct.id, currentQty, selectedSize);
      window.location.href = 'checkout.html';
    }

    function openZoom(imgUrl) {
      const root = document.getElementById('zoom-modal-root');
      root.innerHTML = `
        <div class="modal-backdrop" onclick="this.remove()">
          <div class="modal-content" style="max-width: 760px; padding: 12px; background: transparent; box-shadow: none;" onclick="event.stopPropagation()">
            <img src="${imgUrl}" style="width: 100%; border-radius: var(--radius-lg); box-shadow: var(--shadow-xl);">
            <button class="action-btn" style="position: absolute; top: 24px; right: 24px; background: var(--cloud-white);" onclick="document.getElementById('zoom-modal-root').innerHTML=''"><i data-lucide="x"></i></button>
          </div>
        </div>
      `;
      if (window.lucide) lucide.createIcons();
    }

    window.openRingSizeModal = function() {
      const root = document.getElementById('zoom-modal-root');
      root.innerHTML = `
        <div class="modal-backdrop" onclick="this.remove()">
          <div class="modal-content" style="max-width: 680px; max-height: 90vh; overflow-y: auto; padding: 40px 30px; text-align: center; background: var(--cloud-white); border-radius: var(--radius-lg); position: relative; box-shadow: var(--shadow-xl);" onclick="event.stopPropagation()">
            <button class="modal-close-btn" style="position: absolute; top: 16px; right: 16px; background: none; border: none; cursor: pointer; color: var(--onyx);" onclick="document.getElementById('zoom-modal-root').innerHTML=''"><i data-lucide="x" style="width: 20px; height: 20px;"></i></button>
            
            <!-- Brand Logo from assets -->
            <img src="assets/logo.svg" alt="Abel's By Lincy" style="height: 32px; margin: 0 auto 16px auto; display: block; filter: brightness(0.1);">
            
            <!-- Header -->
            <h3 style="font-family: var(--font-serif); font-size: 26px; font-weight: 500; color: var(--onyx); margin-bottom: 2px;">Find your Ring size</h3>
            <p style="font-family: var(--font-serif); font-style: italic; font-size: 18px; color: var(--gold-dark); margin-bottom: 24px;">the easy way</p>
            
            <!-- Steps Grid -->
            <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 28px; text-align: left;">
              <div style="background: var(--cream); padding: 16px; border-radius: var(--radius-sm); border: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; text-align: center;">
