<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 15 480 230" width="100%" height="100%">
  <defs>
    <style>
      .logo-brand { font-family: 'Playfair Display', Georgia, serif; font-size: 52px; font-weight: 800; letter-spacing: 6px; fill: #1A1A1A; }
      .logo-sub { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; font-weight: 800; letter-spacing: 10px; fill: #7D8E78; }
      .logo-line { stroke: #D4AF37; stroke-width: 2.5; opacity: 0.9; }
    </style>
  </defs>

  <!-- Monogram Graphic -->
  <g transform="translate(240, 75) scale(1.05)" text-anchor="middle">
    <!-- Outer Flourish & Script AS -->
    <path d="M-55,30 C-60,-10 -30,-48 5,-50 C25,-52 46,-38 40,-18 C34,0 12,6 -12,15 C-38,24 -60,18 -55,36 C-50,54 -15,58 16,46 C40,36 56,15 62,0" fill="none" stroke="#1A1A1A" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Central Crossings -->
    <path d="M-20,30 C-6,-12 14,-46 28,-48 C36,-50 44,-40 38,-30 C32,-16 16,-4 -8,10 C-32,24 -42,44 -26,50 C-10,56 22,48 46,26" fill="none" stroke="#1A1A1A" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Gold Highlight Accent -->
    <path d="M-12,-18 C0,-35 20,-42 30,-36 C42,-30 35,-12 18,-1 C1,10 -24,22 -16,38 C-12,48 8,46 26,36" fill="none" stroke="#D4AF37" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Sparkle Star Accent -->
    <g transform="translate(42, -42)">
      <path d="M0,-12 Q0,-2 10,0 Q0,2 0,12 Q0,2 -10,0 Q0,-2 0,-12 Z" fill="#D4AF37"/>
      <circle cx="0" cy="0" r="1.8" fill="#1A1A1A"/>
    </g>
  </g>

  <!-- Main Brand Name: ABEL'S -->
  <text x="240" y="184" text-anchor="middle" class="logo-brand">ABEL’S</text>

  <!-- Divider Lines & BY LINCY -->
  <line x1="80" y1="214" x2="165" y2="214" class="logo-line"/>
  <text x="245" y="219" text-anchor="middle" class="logo-sub">BY LINCY</text>
  <line x1="315" y1="214" x2="400" y2="214" class="logo-line"/>
</svg>
