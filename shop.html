<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fine Jewellery Catalogue | Abel's By Lincy Sydney</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="styles.css?v=20260812-4">
</head>
<body data-page="shop">

  <div id="header-root"></div>

  <div class="page-hero">
    <div class="container">
      <p class="section-subtitle">The Collection</p>
      <h1>Fine Jewellery Catalogue</h1>
      <p style="font-size: 14px; color: var(--slate); margin-top: 8px;">Anti-tarnish gold-plated jewellery for every style and occasion.</p>
    </div>
  </div>

  <!-- Mobile Sticky Filter & Sort Bar (Reference Image 3) -->
  <div class="mobile-filter-bar">
    <div class="container">
      <div class="mobile-filter-inner">
        <button class="mobile-bar-btn" onclick="openMobileSortModal()">
          <i data-lucide="arrow-down-up" style="width: 15px; height: 15px;"></i>
          <span>Sort</span>
        </button>
        <div class="mobile-bar-divider"></div>
        <button class="mobile-bar-btn" onclick="openMobileFilterDrawer()">
          <i data-lucide="sliders-horizontal" style="width: 15px; height: 15px;"></i>
          <span>Filter</span>
          <span id="mobile-filter-badge" class="filter-count-badge" style="display: none;">0</span>
        </button>
      </div>
    </div>
  </div>

  <div class="container">
    <div class="shop-page-layout">
      
      <!-- Filter Sidebar (Desktop) -->
      <aside class="shop-sidebar">
        
        <!-- Category Filter -->
        <div class="filter-block">
          <h5 class="filter-title">Category</h5>
          <ul class="filter-list" id="category-filter-list"></ul>
        </div>

        <!-- Material Filter -->
        <div class="filter-block">
          <h5 class="filter-title">Material</h5>
          <div id="material-filter-list" style="display: flex; flex-direction: column; gap: 8px;"></div>
        </div>

        <!-- Gemstone Filter -->
        <div class="filter-block">
          <h5 class="filter-title">Gemstone</h5>
          <div id="gemstone-filter-list" style="display: flex; flex-direction: column; gap: 8px;"></div>
        </div>

        <!-- Price Range Slider -->
        <div class="filter-block">
          <h5 class="filter-title">Price Range</h5>
          <input type="range" class="price-range-slider" id="price-slider" min="0" max="1500" step="50" value="1500" oninput="handlePriceChange(this.value)">
          <div class="price-slider-values">
            <span>$0</span>
            <span id="price-slider-val">Max: $1,500</span>
          </div>
        </div>

        <button class="btn-secondary" style="width: 100%; padding: 10px;" onclick="resetFilters()">
          Reset All Filters
        </button>
      </aside>

      <!-- Main Product Area -->
      <main>
        <div class="shop-toolbar">
          <p style="font-size: 14px; color: var(--slate);" id="results-count-text">Showing pieces</p>
          
          <div style="display: flex; align-items: center; gap: 16px;">
            <label style="font-size: 13px; color: var(--slate); font-weight: 500;">Sort By:</label>
            <select class="sort-select" id="sort-select" onchange="renderShopProducts()">
              <option value="featured">Featured</option>
              <option value="price-asc">Price: Low to High</option>
              <option value="price-desc">Price: High to Low</option>
              <option value="rating">Best Rating</option>
              <option value="newest">New Arrivals</option>
            </select>
          </div>
        </div>

        <div class="products-grid-3" id="shop-products-grid"></div>
      </main>

    </div>
  </div>

  <!-- Mobile Drawers Root -->
  <div id="mobile-drawer-root"></div>

  <div id="footer-root"></div>

  <script src="app.js?v=20260812-4"></script>
  <script>
    let activeCategory = 'all';
    let selectedMaterials = [];
    let selectedGemstones = [];
    let maxPrice = 1500;
    let currentSort = 'featured';

    document.addEventListener('DOMContentLoaded', () => {
      // Check URL search params for category
      const params = new URLSearchParams(window.location.search);
      const urlCat = params.get('category');
      if (urlCat) activeCategory = urlCat.toLowerCase();

      renderFilters();
      renderShopProducts();
    });

    function updateActiveFilterBadge() {
      let count = 0;
      if (activeCategory !== 'all') count++;
      count += selectedMaterials.length;
      count += selectedGemstones.length;
      if (maxPrice < 1500) count++;

      const badge = document.getElementById('mobile-filter-badge');
      if (badge) {
        if (count > 0) {
          badge.style.display = 'inline-flex';
          badge.textContent = count;
        } else {
          badge.style.display = 'none';
        }
      }
    }

    function renderFilters() {
      // Category List (Reference Image 2)
      const categories = ['all', 'rings', 'necklaces', 'earrings', 'bracelets'];
      const catListEl = document.getElementById('category-filter-list');
      if (catListEl) {
        catListEl.innerHTML = categories.map(cat => {
          const count = cat === 'all' ? window.abl.state.products.length : window.abl.state.products.filter(p => p.category.toLowerCase() === cat).length;
          return `
            <li class="filter-option ${activeCategory === cat ? 'active' : ''}" onclick="setCategory('${cat}')">
              <span style="text-transform: capitalize;">${cat}</span>
              <span style="font-weight: 600; color: ${activeCategory === cat ? 'var(--gold)' : 'var(--slate)'};">${count}</span>
            </li>
          `;
        }).join('');
      }

      // Materials
      const materials = ['18k Gold', 'Rose Gold', 'White Gold', 'Sterling Silver'];
      const matListEl = document.getElementById('material-filter-list');
      if (matListEl) {
        matListEl.innerHTML = materials.map(mat => `
          <label class="filter-checkbox-label">
            <input type="checkbox" class="filter-checkbox" value="${mat}" ${selectedMaterials.includes(mat) ? 'checked' : ''} onchange="toggleMaterial('${mat}')">
            <span style="font-size: 13px; color: var(--onyx);">${mat}</span>
          </label>
        `).join('');
      }

      // Gemstones
      const gemstones = ['Diamond', 'Sapphire', 'Pearl', 'Onyx', 'None'];
      const gemListEl = document.getElementById('gemstone-filter-list');
      if (gemListEl) {
        gemListEl.innerHTML = gemstones.map(gem => `
          <label class="filter-checkbox-label">
            <input type="checkbox" class="filter-checkbox" value="${gem}" ${selectedGemstones.includes(gem) ? 'checked' : ''} onchange="toggleGemstone('${gem}')">
            <span style="font-size: 13px; color: var(--onyx);">${gem}</span>
          </label>
        `).join('');
      }

      updateActiveFilterBadge();
    }

    function setCategory(cat) {
      activeCategory = cat;
      renderFilters();
      renderShopProducts();
    }

    function toggleMaterial(mat) {
      if (selectedMaterials.includes(mat)) {
        selectedMaterials = selectedMaterials.filter(m => m !== mat);
      } else {
        selectedMaterials.push(mat);
      }
      renderFilters();
      renderShopProducts();
    }

    function toggleGemstone(gem) {
      if (selectedGemstones.includes(gem)) {
        selectedGemstones = selectedGemstones.filter(g => g !== gem);
      } else {
        selectedGemstones.push(gem);
      }
      renderFilters();
      renderShopProducts();
    }

    function handlePriceChange(val) {
      maxPrice = parseInt(val, 10);
      const valEl = document.getElementById('price-slider-val');
      if (valEl) valEl.textContent = `Max: $${maxPrice.toLocaleString()}`;
      updateActiveFilterBadge();
      renderShopProducts();
    }

    function resetFilters() {
      activeCategory = 'all';
      selectedMaterials = [];
      selectedGemstones = [];
      maxPrice = 1500;
      const slider = document.getElementById('price-slider');
      if (slider) slider.value = 1500;
      const valEl = document.getElementById('price-slider-val');
      if (valEl) valEl.textContent = 'Max: $1,500';
      document.querySelectorAll('.filter-checkbox').forEach(cb => cb.checked = false);
      renderFilters();
      renderShopProducts();
    }

    // =========================================================================
    // MOBILE BOTTOM SHEET DRAWERS (SORT & FILTER - REFERENCE IMAGES 2 & 3)
    // =========================================================================

    function openMobileSortModal() {
      const root = document.getElementById('mobile-drawer-root');
      const sortOptions = [
        { id: 'featured', label: 'Featured (Recommended)' },
        { id: 'price-asc', label: 'Price: Low to High' },
        { id: 'price-desc', label: 'Price: High to Low' },
        { id: 'rating', label: 'Customer Rating' },
        { id: 'newest', label: 'New Arrivals' }
      ];

      root.innerHTML = `
        <div class="mobile-drawer-backdrop" onclick="this.remove()">
          <div class="mobile-drawer-content" onclick="event.stopPropagation()">
            <div class="mobile-drawer-header">
              <h4>Sort By</h4>
              <button onclick="document.getElementById('mobile-drawer-root').innerHTML=''" style="background: none; border: none; font-size: 20px; color: var(--slate);"><i data-lucide="x"></i></button>
            </div>
            <div class="mobile-drawer-body">
              ${sortOptions.map(opt => `
                <div class="sort-radio-item ${currentSort === opt.id ? 'active' : ''}" onclick="applyMobileSort('${opt.id}')">
                  <span>${opt.label}</span>
                  ${currentSort === opt.id ? '<i data-lucide="check" style="width: 16px; height: 16px; color: var(--gold);"></i>' : ''}
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;
      if (window.lucide) lucide.createIcons();
    }

    function applyMobileSort(sortId) {
      currentSort = sortId;
      const select = document.getElementById('sort-select');
      if (select) select.value = sortId;
      document.getElementById('mobile-drawer-root').innerHTML = '';
      renderShopProducts();
    }

    function openMobileFilterDrawer() {
      const root = document.getElementById('mobile-drawer-root');
      const categories = ['all', 'rings', 'necklaces', 'earrings', 'bracelets'];
      const materials = ['18k Gold', 'Rose Gold', 'White Gold', 'Sterling Silver'];
      const gemstones = ['Diamond', 'Sapphire', 'Pearl', 'Onyx'];

      root.innerHTML = `
        <div class="mobile-drawer-backdrop" onclick="this.remove()">
          <div class="mobile-drawer-content" onclick="event.stopPropagation()">
            <div class="mobile-drawer-header">
              <h4>Filter Collection</h4>
              <button onclick="document.getElementById('mobile-drawer-root').innerHTML=''" style="background: none; border: none; font-size: 20px; color: var(--slate);"><i data-lucide="x"></i></button>
            </div>

            <div class="mobile-drawer-body">
              
              <!-- Category List (Reference Image 2) -->
              <div class="filter-block" style="margin-bottom: 24px;">
                <h5 class="filter-title" style="letter-spacing: 0.1em; text-transform: uppercase; font-size: 11px; margin-bottom: 12px;">CATEGORY</h5>
                <ul class="filter-list" style="list-style: none;">
                  ${categories.map(cat => {
                    const count = cat === 'all' ? window.abl.state.products.length : window.abl.state.products.filter(p => p.category.toLowerCase() === cat).length;
                    const isActive = activeCategory === cat;
                    return `
                      <li style="display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border-light); cursor: pointer; color: ${isActive ? 'var(--gold)' : 'var(--onyx)'}; font-weight: ${isActive ? '600' : 'normal'};" onclick="setCategory('${cat}'); openMobileFilterDrawer();">
                        <span style="text-transform: capitalize;">${cat}</span>
                        <span style="font-weight: 600; color: ${isActive ? 'var(--gold)' : 'var(--slate)'};">${count}</span>
                      </li>
                    `;
                  }).join('')}
                </ul>
              </div>

              <!-- Material (Reference Image 2) -->
              <div class="filter-block" style="margin-bottom: 24px;">
                <h5 class="filter-title" style="letter-spacing: 0.1em; text-transform: uppercase; font-size: 11px; margin-bottom: 12px;">MATERIAL</h5>
                <div style="display: flex; flex-direction: column; gap: 12px;">
                  ${materials.map(mat => `
                    <label style="display: flex; align-items: center; gap: 12px; font-size: 14px; cursor: pointer;">
                      <input type="checkbox" class="filter-checkbox" value="${mat}" ${selectedMaterials.includes(mat) ? 'checked' : ''} onchange="toggleMaterial('${mat}')">
                      <span>${mat}</span>
                    </label>
                  `).join('')}
                </div>
              </div>

              <!-- Gemstone (Reference Image 2) -->
              <div class="filter-block" style="margin-bottom: 24px;">
                <h5 class="filter-title" style="letter-spacing: 0.1em; text-transform: uppercase; font-size: 11px; margin-bottom: 12px;">GEMSTONE</h5>
                <div style="display: flex; flex-direction: column; gap: 12px;">
                  ${gemstones.map(gem => `
                    <label style="display: flex; align-items: center; gap: 12px; font-size: 14px; cursor: pointer;">
                      <input type="checkbox" class="filter-checkbox" value="${gem}" ${selectedGemstones.includes(gem) ? 'checked' : ''} onchange="toggleGemstone('${gem}')">
                      <span>${gem}</span>
                    </label>
                  `).join('')}
                </div>
              </div>

              <!-- Price Range -->
              <div class="filter-block">
                <h5 class="filter-title" style="letter-spacing: 0.1em; text-transform: uppercase; font-size: 11px; margin-bottom: 8px;">PRICE RANGE</h5>
                <input type="range" class="price-range-slider" min="0" max="1500" step="50" value="${maxPrice}" oninput="handlePriceChange(this.value); document.getElementById('drawer-price-val').textContent = 'Max: $' + parseInt(this.value).toLocaleString();">
                <div class="price-slider-values" style="display: flex; justify-content: space-between; font-size: 13px; font-weight: 600;">
                  <span>$0</span>
                  <span id="drawer-price-val">Max: $${maxPrice.toLocaleString()}</span>
                </div>
              </div>

            </div>

            <div class="mobile-drawer-footer">
              <button class="btn-secondary" style="flex: 1; padding: 12px;" onclick="resetFilters(); document.getElementById('mobile-drawer-root').innerHTML='';">
                Clear All
              </button>
              <button class="btn-primary" style="flex: 1.5; padding: 12px;" onclick="document.getElementById('mobile-drawer-root').innerHTML=''">
                Apply Filters
              </button>
            </div>

          </div>
        </div>
      `;
      if (window.lucide) lucide.createIcons();
    }

    function renderShopProducts() {
      let filtered = window.abl.state.products.filter(p => {
        if (activeCategory !== 'all' && p.category.toLowerCase() !== activeCategory) return false;
        if (selectedMaterials.length > 0 && !selectedMaterials.some(m => p.material.toLowerCase().includes(m.toLowerCase()))) return false;
        if (selectedGemstones.length > 0 && !selectedGemstones.includes(p.gemstone)) return false;
        if (p.price > maxPrice) return false;
        return true;
      });

      const sortVal = document.getElementById('sort-select') ? document.getElementById('sort-select').value : currentSort;
      if (sortVal === 'price-asc') filtered.sort((a, b) => a.price - b.price);
      else if (sortVal === 'price-desc') filtered.sort((a, b) => b.price - a.price);
      else if (sortVal === 'rating') filtered.sort((a, b) => b.rating - a.rating);
      else if (sortVal === 'newest') filtered.sort((a, b) => (b.badge === 'new' ? 1 : -1));

      const countEl = document.getElementById('results-count-text');
      if (countEl) countEl.innerHTML = `Showing <strong>${filtered.length}</strong> pieces`;

      const grid = document.getElementById('shop-products-grid');
      if (filtered.length === 0) {
        grid.innerHTML = `
          <div style="grid-column: 1 / -1; text-align: center; padding: 60px 20px;">
            <i data-lucide="package-search" style="width: 48px; height: 48px; color: var(--slate-light); margin-bottom: 16px;"></i>
            <h3 style="font-family: var(--font-serif); font-size: 22px; margin-bottom: 8px;">No Pieces Match Selected Filters</h3>
            <p style="color: var(--slate); font-size: 14px; margin-bottom: 20px;">Try adjusting your metal, gemstone or price sliders.</p>
            <button class="btn-primary" onclick="resetFilters()">Reset Filters</button>
          </div>
        `;
      } else {
        grid.innerHTML = filtered.map(p => {
          const isWishlisted = window.abl.state.wishlist.includes(p.id);
          const discountPercent = p.originalPrice ? Math.round(((p.originalPrice - p.price) / p.originalPrice) * 100) : 0;
          return `
            <div class="product-card" onclick="window.location.href='product.html?id=${p.id}'">
              <div class="product-img-wrapper">
                <img src="${p.image}" alt="${p.name}" loading="lazy">
                
                ${discountPercent > 0 ? `
                  <span class="product-badge" style="background: var(--onyx); color: var(--gold); font-weight: 700;">
                    ↓ ${discountPercent}% OFF
                  </span>
                ` : (p.badge ? `<span class="product-badge badge-${p.badge}">${p.badge}</span>` : '')}

                <button class="wishlist-btn ${isWishlisted ? 'active' : ''}" onclick="event.stopPropagation(); window.abl.toggleWishlist('${p.id}')" title="Save to Wishlist">
                  <i data-lucide="heart" style="${isWishlisted ? 'fill: var(--danger); stroke: var(--danger);' : ''}"></i>
                </button>

                <div class="quick-add-bar">
                  <button class="quick-add-btn" onclick="event.stopPropagation(); window.abl.addToCart('${p.id}')">
                    <i data-lucide="shopping-bag" style="width: 14px; height: 14px;"></i> Quick Add
                  </button>
                </div>
              </div>

              <div class="product-info">
                <p class="product-category">${p.category}</p>
                <h4 class="product-name">${p.name}</h4>
                
                <div class="product-price-row" style="margin-top: 4px;">
                  <span class="current-price">${window.abl.formatMoney(p.price)}</span>
                  ${p.originalPrice ? `<span class="original-price">${window.abl.formatMoney(p.originalPrice)}</span>` : ''}
                </div>

                <div style="font-size: 11px; color: var(--gold); font-weight: 600; margin-top: 4px;">
                  ${p.stockQty && p.stockQty <= 5 ? 'Only few left' : 'In Stock'}
                </div>
              </div>
            </div>
          `;
        }).join('');
      }

      updateActiveFilterBadge();
      if (window.lucide) lucide.createIcons();
    }
  </script>
</body>
</html>
