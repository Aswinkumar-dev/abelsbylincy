<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Payment Action Required</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #fcfbf9; padding: 20px; color: #232323;">
  <div style="max-width: 600px; margin: 0 auto; background-color: #ffffff; padding: 40px; border: 1px solid #e5e5e5; border-radius: 8px;">
    <div style="text-align: center; margin-bottom: 30px;">
      <h1 style="font-family: 'Times New Roman', serif; font-size: 28px; letter-spacing: 2px; margin: 0; color: #1a1a1a;">ABEL'S BY LINCY</h1>
      <span style="font-size: 10px; letter-spacing: 3px; color: #c5a059; font-weight: 600;">SYDNEY</span>
    </div>
    <h2 style="font-size: 20px; font-weight: 600; color: #d9534f; margin-bottom: 10px;">Payment Failed</h2>
    <p style="font-size: 12px; color: #888888; margin-top: 0; margin-bottom: 25px;">Order Number: {{orderNumber}}</p>
    
    <p style="font-size: 14px; line-height: 1.6; color: #555555; margin-bottom: 30px;">
      Hello {{customerName}}, we were unable to process your payment of {{total}} for your recent order. Please click the button below to update your payment information.
    </p>
    <div style="text-align: center; margin-bottom: 30px;">
      <a href="{{checkoutUrl}}" style="background-color: #d9534f; color: #ffffff; text-decoration: none; padding: 12px 30px; font-size: 14px; font-weight: 600; border-radius: 4px; display: inline-block; letter-spacing: 1px;">Resolve Payment</a>
    </div>
    <hr style="border: 0; border-top: 1px solid #eeeeee; margin: 30px 0;">
    <p style="font-size: 11px; text-align: center; color: #aaaaaa;">
      &copy; 2026 Abel's By Lincy. All rights reserved.
    </p>
  </div>
</body>
</html>
