<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Under Maintenance | Abel's By Lincy</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@400;600&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    :root {
      --onyx: #1A1A1A;
      --sage: #7D8E78;
      --cream: #F8F6F2;
      --gold: #D4AF37;
      --slate: #6E7068;
      --font-serif: 'Sora', 'Segoe UI', Arial, sans-serif;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--cream);
      color: var(--onyx);
      font-family: var(--font-sans);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }

    .maintenance-container {
      width: 100%;
      max-width: 500px;
      background-color: #ffffff;
      padding: 48px 32px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
      border: 1px solid rgba(125, 142, 120, 0.15);
    }

    .logo-img {
      max-width: 180px;
      height: auto;
      margin-bottom: 32px;
    }

    .icon-container {
      width: 64px;
      height: 64px;
      background-color: rgba(125, 142, 120, 0.1);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      color: var(--sage);
    }

    h1 {
      font-family: var(--font-serif);
      font-weight: 600;
      font-size: 28px;
      margin-bottom: 16px;
      color: var(--onyx);
      letter-spacing: -0.5px;
    }

    p {
      color: var(--slate);
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .divider {
      height: 1px;
      background-color: #ECECEC;
      margin: 24px 0;
    }

    .contact-info {
      font-size: 14px;
      color: var(--slate);
    }

    .contact-info a {
      color: var(--sage);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s ease;
    }

    .contact-info a:hover {
      color: var(--gold);
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="maintenance-container">
    <img src="assets/logo.svg" alt="Abel's By Lincy" class="logo-img">
    
    <div class="icon-container">
      <i data-lucide="wrench" style="width: 28px; height: 28px;"></i>
    </div>
    
    <h1>Website Under Maintenance</h1>
    <p>We are currently updating our website to provide a better shopping experience. We'll be back online shortly. Thank you for your patience!</p>
    
    <div class="divider"></div>
    
    <div class="contact-info">
      Need to get in touch? Email us at <br>
      <a href="mailto:lincytitus8@gmail.com">lincytitus8@gmail.com</a>
    </div>
  </div>

  <script>
    if (window.lucide) {
      lucide.createIcons();
    }
  </script>
</body>
</html>
